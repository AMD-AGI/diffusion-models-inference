name: 'Check MIOpen Changes'
description: 'Checks if Dockerfile or MIOpen drivercmd files changed'
inputs:
  base_ref:
    description: 'Base reference for comparison (default: HEAD~1)'
    required: false
    default: 'HEAD~1'
  head_ref:
    description: 'Head reference for comparison (default: HEAD)'
    required: false
    default: 'HEAD'

outputs:
  should_trigger:
    description: 'Whether tuning workflow should be triggered (true if either changed)'
    value: ${{ steps.check.outputs.should_trigger }}

runs:
  using: 'composite'
  steps:
    - name: Check for MIOpen changes
      id: check
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
        HEAD_REF: ${{ inputs.head_ref }}
      run: ${{ github.action_path }}/scripts/check-changes.sh
