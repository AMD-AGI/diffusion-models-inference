name: 'Cleanup Workspace'
description: 'Cleans up Docker resources and workspace files'
inputs:
  images:
    description: 'Space-separated list of Docker images to remove'
    required: false
    default: ''
  containers:
    description: 'Space-separated list of Docker containers to remove'
    required: false
    default: ''
  skip_workspace_cleanup:
    description: 'Skip cleaning the workspace directory'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Cleanup Docker resources
      if: ${{ inputs.containers != '' || inputs.images != '' }}
      shell: bash
      env:
        CONTAINERS: ${{ inputs.containers }}
        IMAGES: ${{ inputs.images }}
      run: ${{ github.action_path }}/scripts/cleanup-docker.sh
    
    # Use containerized cleanup to avoid permission issues on self-hosted runners
    - name: Clean workspace
      if: ${{ inputs.skip_workspace_cleanup != 'true' }}
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        docker run --rm -v "${WORKSPACE}:/workspace" ubuntu:24.04 sh -c 'rm -rf /workspace/* /workspace/.??*' || true

