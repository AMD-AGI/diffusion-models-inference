name: 'Cleanup Workspace'
description: 'Cleans up Docker resources and workspace files'
inputs:
  images:
    description: 'Space-separated list of Docker images to remove'
    required: false
    default: ''
  containers:
    description: 'Space-separated list of Docker containers to remove'
    required: false
    default: ''
  skip_workspace_cleanup:
    description: 'Skip cleaning the workspace directory'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Remove containers
      if: ${{ inputs.containers != '' }}
      shell: bash
      run: |
        for container in ${{ inputs.containers }}; do
          echo "Removing container: $container"
          docker rm -f $container || true
        done
    
    - name: Remove images
      if: ${{ inputs.images != '' }}
      shell: bash
      run: |
        for image in ${{ inputs.images }}; do
          echo "Removing image: $image"
          docker rmi -f $image || true
        done
    
    - name: Prune Docker images
      shell: bash
      run: docker image prune -f || true
    
    # Use containerized cleanup to avoid permission issues on self-hosted runners
    - name: Clean workspace
      if: ${{ inputs.skip_workspace_cleanup != 'true' }}
      shell: bash
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" ubuntu:24.04 sh -c 'rm -rf /workspace/* /workspace/.??*' || true
    
    - name: Show GPU status
      shell: bash
      run: |
        amd-smi || true
        rocm-smi || true
