name: 'Create MIOpen Database branch'
description: 'Creates a branch with MIOpen database changes, pushes it, and opens a pull request'

inputs:
  branch_name:
    description: 'Branch name for the MIOpen database update'
    required: true
  run_number:
    description: 'GitHub Actions run number'
    required: true
  base_branch:
    description: 'Branch the pull request targets'
    required: false
    default: ${{ github.ref_name }}
  gh_token:
    description: 'Token used to open the pull request'
    required: false
    default: ${{ github.token }}

outputs:
  has_changes:
    description: 'Whether the tuning run produced database changes'
    value: ${{ steps.check_changes.outputs.has_changes }}
  pull_request_url:
    description: 'URL of the opened pull request, empty when none was created'
    value: ${{ steps.pull_request.outputs.url }}

runs:
  using: 'composite'
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Create and checkout branch
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
      run: |
        echo "Creating branch: ${BRANCH_NAME}"
        git checkout -b "${BRANCH_NAME}"
    
    - name: Check for MIOpen changes
      id: check_changes
      shell: bash
      run: |
        if [ -d "data/miopen/userdb" ] && [ "$(ls -A data/miopen/userdb 2>/dev/null)" ]; then
          git add data/miopen/userdb/*.udb.txt data/miopen/userdb/*.ufdb.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit changes
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      env:
        RUN_NUMBER: ${{ inputs.run_number }}
      run: |
        COMMIT_MSG="Update MIOpen database (run #${RUN_NUMBER})"
        echo "Committing with message: ${COMMIT_MSG}"
        git commit -m "${COMMIT_MSG}"
    
    - name: Push branch
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
      run: |
        echo "Pushing branch: ${BRANCH_NAME}"
        git push origin "${BRANCH_NAME}"

    - name: Create pull request
      id: pull_request
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        BRANCH_NAME: ${{ inputs.branch_name }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        RUN_NUMBER: ${{ inputs.run_number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pulls
      run: ${{ github.action_path }}/scripts/create-pull-request.sh
