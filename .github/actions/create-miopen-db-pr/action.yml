name: 'Create MIOpen Database PR'
description: 'Creates a branch with MIOpen database changes and opens a pull request'

inputs:
  branch_name:
    description: 'Branch name for the MIOpen database update'
    required: true
  run_number:
    description: 'GitHub Actions run number'
    required: true
  gh_token:
    description: 'GitHub token for creating PR'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Create and checkout branch
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
      run: |
        echo "Creating branch: ${BRANCH_NAME}"
        git checkout -b "${BRANCH_NAME}"
    
    - name: Check for MIOpen changes
      id: check_changes
      shell: bash
      run: |
        if [ -d "data/miopen/userdb" ] && [ "$(ls -A data/miopen/userdb 2>/dev/null)" ]; then
          git add data/miopen/userdb/*.udb.txt data/miopen/userdb/*.ufdb.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit changes
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      env:
        RUN_NUMBER: ${{ inputs.run_number }}
      run: |
        COMMIT_MSG="Update MIOpen database (run #${RUN_NUMBER})"
        echo "Committing with message: ${COMMIT_MSG}"
        git commit -m "${COMMIT_MSG}"
    
    - name: Push branch
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
      run: |
        echo "Pushing branch: ${BRANCH_NAME}"
        git push origin "${BRANCH_NAME}"
    
    - name: Create PR
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        BRANCH_NAME: ${{ inputs.branch_name }}
        RUN_NUMBER: ${{ inputs.run_number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPOSITORY: ${{ github.repository }}
        BASE_REF: ${{ github.ref_name }}
        API_URL: ${{ github.api_url }}
      run: |
        PR_TITLE="MIOpen tuning, run ${RUN_NUMBER}"
        PR_BODY="Run: ${RUN_URL}"
        curl -fsS -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "${API_URL}/repos/${REPOSITORY}/pulls" \
          -d "$(jq -n \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg head "$BRANCH_NAME" \
            --arg base "$BASE_REF" \
            '{title: $title, body: $body, head: $head, base: $base}')"