name: 'Generate Architecture Matrix'
description: 'Generates matrix configuration for enabled architectures'
inputs:
  workflow_inputs:
    description: 'JSON string of all workflow inputs'
    required: true

outputs:
  matrix:
    description: 'Full matrix JSON for all architectures'
    value: ${{ steps.generate.outputs.matrix }}
  allocator_matrix:
    description: 'Matrix JSON for Allocator-enabled architectures'
    value: ${{ steps.generate.outputs.allocator_matrix }}

runs:
  using: 'composite'
  steps:
    - name: Generate matrix
      id: generate
      shell: bash
      run: |
        # Parse inputs from JSON
        MI300_RUNNER=$(echo '${{ inputs.workflow_inputs }}' | jq -r '.mi300_runner // ""' | xargs)
        MI300_RUNNER_TYPE=$(echo '${{ inputs.workflow_inputs }}' | jq -r '.mi300_runner_type // "Standard runner"')
        
        MI325_RUNNER=$(echo '${{ inputs.workflow_inputs }}' | jq -r '.mi325_runner // ""' | xargs)
        MI325_RUNNER_TYPE=$(echo '${{ inputs.workflow_inputs }}' | jq -r '.mi325_runner_type // "Standard runner"')
        
        MI355_RUNNER=$(echo '${{ inputs.workflow_inputs }}' | jq -r '.mi355_runner // ""' | xargs)
        MI355_RUNNER_TYPE=$(echo '${{ inputs.workflow_inputs }}' | jq -r '.mi355_runner_type // "Standard runner"')
        
        ALLOCATOR_RESERVATION_HOURS=$(echo '${{ inputs.workflow_inputs }}' | jq -r '.allocator_reservation_hours // "4"')
        
        # Function to parse runner type into constituent flags
        parse_runner_type() {
          local runner_type="$1"
          case "$runner_type" in
            "Standard runner")
              echo "is_allocator_node=true is_allocator_pool=false allocator_reserve=true"
              ;;
            "Standard runner")
              echo "is_allocator_node=true is_allocator_pool=false allocator_reserve=false"
              ;;
            "Standard runner")
              echo "is_allocator_node=false is_allocator_pool=true allocator_reserve=false"
              ;;
            *)
              echo "is_allocator_node=false is_allocator_pool=false allocator_reserve=false"
              ;;
          esac
        }
        
        # Parse MI300 runner type
        eval $(parse_runner_type "$MI300_RUNNER_TYPE")
        MI300_IS_ALLOCATOR_NODE="$is_allocator_node"
        MI300_IS_ALLOCATOR_POOL="$is_allocator_pool"
        MI300_ALLOCATOR_RESERVE="$allocator_reserve"
        
        # Parse MI325 runner type
        eval $(parse_runner_type "$MI325_RUNNER_TYPE")
        MI325_IS_ALLOCATOR_NODE="$is_allocator_node"
        MI325_IS_ALLOCATOR_POOL="$is_allocator_pool"
        MI325_ALLOCATOR_RESERVE="$allocator_reserve"
        
        # Parse MI355 runner type
        eval $(parse_runner_type "$MI355_RUNNER_TYPE")
        MI355_IS_ALLOCATOR_NODE="$is_allocator_node"
        MI355_IS_ALLOCATOR_POOL="$is_allocator_pool"
        MI355_ALLOCATOR_RESERVE="$allocator_reserve"
        
        MATRIX_JSON='{"include":['
        FIRST=true
        
        # MI300
        if [ -n "$MI300_RUNNER" ]; then
          # Calculate timeout: reservation hours * 60 (if using Allocator with reservation), 2880 min (48h for Allocator without reservation), or 1440 min (24h default)
          if [ "$MI300_ALLOCATOR_RESERVE" = "true" ]; then
            TIMEOUT=$(($ALLOCATOR_RESERVATION_HOURS * 60))
          elif [ "$MI300_IS_ALLOCATOR_NODE" = "true" ] || [ "$MI300_IS_ALLOCATOR_POOL" = "true" ]; then
            TIMEOUT=2880
          else
            TIMEOUT=1440
          fi
          
          if [ "$FIRST" = "false" ]; then MATRIX_JSON="${MATRIX_JSON},"; fi
          MATRIX_JSON="${MATRIX_JSON}{\"arch\":\"mi300\",\"gfx_arch\":\"gfx942\",\"runner\":\"$MI300_RUNNER\",\"is_allocator_node\":\"$MI300_IS_ALLOCATOR_NODE\",\"is_allocator_pool\":\"$MI300_IS_ALLOCATOR_POOL\",\"allocator_reserve\":\"$MI300_ALLOCATOR_RESERVE\",\"timeout\":${TIMEOUT}}"
          FIRST=false
        fi
        
        # MI325
        if [ -n "$MI325_RUNNER" ]; then
          # Calculate timeout
          if [ "$MI325_ALLOCATOR_RESERVE" = "true" ]; then
            TIMEOUT=$(($ALLOCATOR_RESERVATION_HOURS * 60))
          elif [ "$MI325_IS_ALLOCATOR_NODE" = "true" ] || [ "$MI325_IS_ALLOCATOR_POOL" = "true" ]; then
            TIMEOUT=2880
          else
            TIMEOUT=1440
          fi
          
          if [ "$FIRST" = "false" ]; then MATRIX_JSON="${MATRIX_JSON},"; fi
          MATRIX_JSON="${MATRIX_JSON}{\"arch\":\"mi325\",\"gfx_arch\":\"gfx942\",\"runner\":\"$MI325_RUNNER\",\"is_allocator_node\":\"$MI325_IS_ALLOCATOR_NODE\",\"is_allocator_pool\":\"$MI325_IS_ALLOCATOR_POOL\",\"allocator_reserve\":\"$MI325_ALLOCATOR_RESERVE\",\"timeout\":${TIMEOUT}}"
          FIRST=false
        fi
        
        # MI355
        if [ -n "$MI355_RUNNER" ]; then
          # Calculate timeout
          if [ "$MI355_ALLOCATOR_RESERVE" = "true" ]; then
            TIMEOUT=$(($ALLOCATOR_RESERVATION_HOURS * 60))
          elif [ "$MI355_IS_ALLOCATOR_NODE" = "true" ] || [ "$MI355_IS_ALLOCATOR_POOL" = "true" ]; then
            TIMEOUT=2880
          else
            TIMEOUT=1440
          fi
          
          if [ "$FIRST" = "false" ]; then MATRIX_JSON="${MATRIX_JSON},"; fi
          MATRIX_JSON="${MATRIX_JSON}{\"arch\":\"mi355\",\"gfx_arch\":\"gfx950\",\"runner\":\"$MI355_RUNNER\",\"is_allocator_node\":\"$MI355_IS_ALLOCATOR_NODE\",\"is_allocator_pool\":\"$MI355_IS_ALLOCATOR_POOL\",\"allocator_reserve\":\"$MI355_ALLOCATOR_RESERVE\",\"timeout\":${TIMEOUT}}"
          FIRST=false
        fi
        
        MATRIX_JSON="${MATRIX_JSON}]}"
        echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
        echo "Generated matrix: ${MATRIX_JSON}"
        
        # Generate allocator matrix by filtering the full matrix
        ALLOCATOR_MATRIX_JSON=$(echo "${MATRIX_JSON}" | jq -c '{include: [.include[] | select(.is_allocator_node == "true" or .is_allocator_pool == "true")]}')
        echo "allocator_matrix=${ALLOCATOR_MATRIX_JSON}" >> $GITHUB_OUTPUT
        echo "Generated allocator matrix: ${ALLOCATOR_MATRIX_JSON}"
