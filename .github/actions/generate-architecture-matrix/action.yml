name: 'Generate Architecture Matrix'
description: 'Generates matrix configuration for enabled architectures'
inputs:
  gpu_runners:
    description: 'Comma-separated list of GPU runner labels'
    required: true

outputs:
  matrix:
    description: 'Full matrix JSON for all architectures'
    value: ${{ steps.generate.outputs.matrix }}

runs:
  using: 'composite'
  steps:
    - name: Generate matrix
      id: generate
      shell: bash
      env:
        GPU_RUNNERS: ${{ inputs.gpu_runners }}
      run: ${{ github.action_path }}/scripts/generate-matrix.sh
