name: Resolve ROCm Nightly
description: >-
  Selects the newest TheRock nightly ROCm wheel build and checks that it has
  all the wheels that docker/install_rocm_wheels.sh pins. Fails when a pinned
  wheel is missing, and writes the version provenance.

inputs:
  provenance_file:
    description: 'Path for the provenance JSON'
    required: false
    default: 'rocm-nightly-provenance.json'

outputs:
  rocm_wheel_version:
    description: 'Newest ROCm nightly wheel version, for example 10.3.0a20261108'
    value: ${{ steps.resolve.outputs.rocm_wheel_version }}

runs:
  using: composite
  steps:
    - name: Resolve ROCm nightly wheel build
      id: resolve
      shell: bash
      env:
        PROVENANCE_FILE: ${{ inputs.provenance_file }}
      run: >-
        python3 "${GITHUB_ACTION_PATH}/scripts/resolve_rocm_nightly.py"
        --provenance "${PROVENANCE_FILE}"
