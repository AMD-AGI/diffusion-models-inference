name: Resolve ROCm Nightly
description: >-
  Selects the newest TheRock nightly ROCm wheel build that has all the wheels
  that docker/install_rocm_wheels.sh pins. Warns when the newest build does
  not have them, and writes the version provenance.

inputs:
  dockerfile:
    description: 'Dockerfile with the ROCm wheel and torch pins (ARG defaults)'
    required: false
    default: 'docker/Dockerfile.ci'
  install_script:
    description: 'Script that prints the ROCm wheel requirement list'
    required: false
    default: 'docker/install_rocm_wheels.sh'
  python_tag:
    description: 'CPython tag of the image venv (ubuntu:24.04 python3 is cp312)'
    required: false
    default: 'cp312'
  provenance_file:
    description: 'Path for the provenance JSON'
    required: false
    default: 'rocm-nightly-provenance.json'

outputs:
  rocm_wheel_version:
    description: 'Selected ROCm nightly wheel version, for example 10.3.0a20261108'
    value: ${{ steps.resolve.outputs.rocm_wheel_version }}
  newest_rocm_wheel_version:
    description: 'Newest rocm-sdk-core build on the index'
    value: ${{ steps.resolve.outputs.newest_rocm_wheel_version }}
  pins_available_in_newest:
    description: "'true' if the newest build has all pinned wheels"
    value: ${{ steps.resolve.outputs.pins_available_in_newest }}

runs:
  using: composite
  steps:
    - name: Resolve ROCm nightly wheel build
      id: resolve
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        INSTALL_SCRIPT: ${{ inputs.install_script }}
        PYTHON_TAG: ${{ inputs.python_tag }}
        PROVENANCE_FILE: ${{ inputs.provenance_file }}
      run: >-
        python3 "${GITHUB_ACTION_PATH}/scripts/resolve_rocm_nightly.py"
        --dockerfile "${DOCKERFILE}"
        --install-script "${INSTALL_SCRIPT}"
        --python-tag "${PYTHON_TAG}"
        --provenance "${PROVENANCE_FILE}"
