name: Resolve ROCm Nightly
description: Resolves the latest coherent TheRock ROCm and PyTorch wheel stack

outputs:
  release_id:
    description: 'Compatibility ID in YYYYMMDD-run-number form'
    value: ${{ steps.resolve.outputs.release_id }}
  rocm_version:
    description: 'ROCm wheel version required by the resolved PyTorch wheel'
    value: ${{ steps.resolve.outputs.rocm_version }}
  pytorch_version:
    description: 'Resolved PyTorch wheel version'
    value: ${{ steps.resolve.outputs.pytorch_version }}
  pytorch_vision_version:
    description: 'Resolved torchvision wheel version'
    value: ${{ steps.resolve.outputs.pytorch_vision_version }}
  pytorch_audio_version:
    description: 'Resolved torchaudio wheel version'
    value: ${{ steps.resolve.outputs.pytorch_audio_version }}

runs:
  using: composite
  steps:
    - name: Resolve latest ROCm nightly
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/resolve.py" | tee -a "$GITHUB_OUTPUT"
