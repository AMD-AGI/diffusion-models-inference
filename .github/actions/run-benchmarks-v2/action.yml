name: Run Benchmarks (inference-testing)
description: >
  Submit xDiT benchmarks to the infrastructure-managed inference-testing driver.
  Requires a runner deployed with the ITT compose override.

inputs:
  image:
    description: 'Docker image to use for benchmarking (passed to the inference-testing DockerServer)'
    required: true
  arch:
    description: 'Architecture name (mi300, mi308, mi325, mi350, mi355)'
    required: true
  benchmark_flags:
    description: 'Flags used to filter benchmarks, leave empty to run all. Examples: --tag release; or --name CONFIG_NAME to run a specific named config (mutually exclusive with tag).'
    required: false
    default: ''
  gfx_arch:
    description: 'GPU architecture tag for benchmark selection (gfx942, gfx950)'
    required: false
    default: ''
  benchmark_only:
    description: 'Whether running in benchmark-only mode'
    required: false
    default: 'false'
  collect_hipblaslt_logs:
    description: 'Collect hipBLASLt GEMM logs per benchmark'
    required: false
    default: 'false'
  output_dir:
    description: 'Output directory name for benchmark results (e.g., benchmarks, benchmarks-baseline)'
    required: false
    default: 'benchmarks'
  hf_token:
    description: 'HuggingFace token for model downloads'
    required: true
  artifact_name:
    description: 'Full artifact name for upload'
    required: true
  job_timeout_minutes:
    description: 'Driver-side timeout for the whole benchmark job'
    required: false
    default: '720'
  databricks_host:
    description: 'Databricks workspace URL. When set with a token, MLflow reports there instead of a local file store.'
    required: false
    default: ''
  databricks_token:
    description: 'Databricks token for MLflow reporting'
    required: false
    default: ''
  mlflow_experiment_prefix:
    description: 'Workspace path prepended to experiment names when reporting to Databricks. Must already exist; Databricks does not create parent folders.'
    required: false
    default: '/'

runs:
  using: composite
  steps:
    - name: Ensure PyYAML is available
      shell: bash
      run: |
        if python3 -c 'import yaml' 2>/dev/null; then
          echo "PyYAML already available in $(command -v python3)"
          exit 0
        fi
        python3 -m ensurepip --user 2>/dev/null || true
        if ! python3 -m pip install --user 'PyYAML>=6,<7'; then
          echo "::error::PyYAML is missing and cannot be installed. Install python3-yaml" \
               "in the runner image, or repair the runner's Python installation."
          exit 1
        fi

    - name: Create benchmark output directory
      shell: bash
      run: |
        rm -rf "$GITHUB_WORKSPACE/${{ inputs.output_dir }}/${{ inputs.arch }}"
        mkdir -p "$GITHUB_WORKSPACE/${{ inputs.output_dir }}/${{ inputs.arch }}"

    - name: Select MLflow backend
      id: mlflow
      shell: bash
      env:
        HAS_HOST: ${{ inputs.databricks_host != '' }}
        HAS_TOKEN: ${{ inputs.databricks_token != '' }}
        EXPERIMENT_PREFIX: ${{ inputs.mlflow_experiment_prefix }}
        OUTPUT_ROOT: ${{ github.workspace }}/${{ inputs.output_dir }}/${{ inputs.arch }}
      run: |
        if [ "$HAS_HOST" = "true" ] && [ "$HAS_TOKEN" = "true" ]; then
          echo "Reporting to Databricks MLflow under ${EXPERIMENT_PREFIX}"
          echo "uri=databricks" >> "$GITHUB_OUTPUT"
          echo "experiment_prefix=${EXPERIMENT_PREFIX}" >> "$GITHUB_OUTPUT"
        else
          echo "Reporting to a local MLflow file store"
          echo "uri=file://${OUTPUT_ROOT}/mlruns" >> "$GITHUB_OUTPUT"
          echo "experiment_prefix=" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare benchmark configs
      id: convert
      shell: bash
      env:
        BENCHMARK_ONLY: ${{ inputs.benchmark_only }}
        COLLECT_HIPBLASLT_LOGS: ${{ inputs.collect_hipblaslt_logs }}
        OUTPUT_ROOT: ${{ github.workspace }}/${{ inputs.output_dir }}/${{ inputs.arch }}
        DOCKER_IMAGE: ${{ inputs.image }}
        INPUT_BENCHMARK_FLAGS: ${{ inputs.benchmark_flags }}
        GFX_ARCH: ${{ inputs.gfx_arch }}
        MLFLOW_URI: ${{ steps.mlflow.outputs.uri }}
        MLFLOW_EXPERIMENT_PREFIX: ${{ steps.mlflow.outputs.experiment_prefix }}
      run: |
        CONVERTED_DIR="$GITHUB_WORKSPACE/.inference-testing-configs"
        rm -rf "$CONVERTED_DIR"
        PREPARE_ARGS=(
          --repo-root "$GITHUB_WORKSPACE"
          --output-dir "$CONVERTED_DIR"
          --image "$DOCKER_IMAGE"
          --work-root "${RUNNER_WORK_ROOT:-/home/runner/_work}"
          --output-root "$OUTPUT_ROOT"
          --benchmark-flags "$INPUT_BENCHMARK_FLAGS"
          --gfx-arch "$GFX_ARCH"
          --mlflow-uri "$MLFLOW_URI"
          --experiment-prefix "$MLFLOW_EXPERIMENT_PREFIX"
          --hf-cache-path "${HF_CACHE_HOST_PATH:-}"
        )
        if [ "$BENCHMARK_ONLY" != "true" ]; then
          PREPARE_ARGS+=(--miopen-user-db "$GITHUB_WORKSPACE/data/miopen/userdb")
        fi
        if [ "$COLLECT_HIPBLASLT_LOGS" = "true" ]; then
          PREPARE_ARGS+=(--collect-hipblaslt-logs)
        fi
        python3 "$GITHUB_ACTION_PATH/prepare-configs.py" "${PREPARE_ARGS[@]}"

    - name: Upload converted configs
      if: ${{ always() && steps.convert.outputs.converted_dir != '' }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact_name }}-configs
        path: ${{ steps.convert.outputs.converted_dir }}
        if-no-files-found: warn
        # The converted directory is dot-prefixed, so it counts as hidden.
        include-hidden-files: true

    - name: Run inference-testing
      if: ${{ steps.convert.outputs.config_count != '0' }}
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        RESULT_DIR: ${{ github.workspace }}/${{ inputs.output_dir }}/${{ inputs.arch }}
        HF_TOKEN: ${{ inputs.hf_token }}
        CONVERTED_DIR: ${{ steps.convert.outputs.converted_dir }}
        JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
        DATABRICKS_HOST: ${{ inputs.databricks_host }}
        DATABRICKS_TOKEN: ${{ inputs.databricks_token }}
      run: bash ${{ github.action_path }}/run-inference-testing.sh

    - name: Verify benchmark results
      if: ${{ steps.convert.outputs.config_count != '0' }}
      shell: bash
      env:
        CONVERTED_DIR: ${{ steps.convert.outputs.converted_dir }}
      run: python3 "$GITHUB_ACTION_PATH/verify-results.py" "$CONVERTED_DIR"

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output_dir }}/${{ inputs.arch }}/**
