name: Run Benchmarks
description: Run xDiT benchmarks for a specific architecture

inputs:
  image:
    description: 'Docker image to use for benchmarking'
    required: true
  arch:
    description: 'Architecture name (mi300, mi308, mi325, mi350, mi355)'
    required: true
  benchmark_flags:
    description: 'Flags used to filter benchmarks, leave empty to run all. Examples: --tag release; or --name CONFIG_NAME to run a specific named config (mutually exclusive with tag).'
    required: false
    default: ''
  gfx_arch:
    description: 'GPU architecture tag for benchmark selection (gfx942, gfx950)'
    required: false
    default: ''
  benchmark_only:
    description: 'Whether running in benchmark-only mode'
    required: false
    default: 'false'
  collect_hipblaslt_logs:
    description: 'Collect hipBLASLt GEMM logs per benchmark (adds runtime overhead). Files are written per-experiment as hipblaslt_gemms_pid<PID>.yaml (one file per worker process) under each experiments output directory.'
    required: false
    default: 'false'
  output_dir:
    description: 'Output directory name for benchmark results (e.g., benchmarks, )'
    required: false
    default: 'benchmarks'
  hf_token:
    description: 'HuggingFace token for model downloads'
    required: true
  hf_cache_map:
    description: 'Hostname to HF cache mapping'
    required: false
    default: ''
  artifact_name:
    description: 'Full artifact name for upload'
    required: true

runs:
  using: composite
  steps:
    - name: Create benchmark output directory
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        ARCH: ${{ inputs.arch }}
      run: |
        rm -rf "$GITHUB_WORKSPACE/$OUTPUT_DIR/$ARCH"
        mkdir -p "$GITHUB_WORKSPACE/$OUTPUT_DIR/$ARCH"
    
    - name: Get HF cache path for node
      id: hf_cache
      shell: bash
      env:
        CACHE_PATHS: ${{ inputs.hf_cache_map }}
      run: |
        HF_CACHE_ARGS=""
        RUN_PY_FLAGS=""
        if [ -n "$CACHE_PATHS" ]; then
          HOSTNAME=$(hostname)
          cache_path=$(echo "$CACHE_PATHS" | jq -r --arg host "$HOSTNAME" '.[$host] // empty')
          if [ -n "$cache_path" ]; then
            if [ -d "$cache_path" ]; then
              echo "HF cache: $cache_path"
              HF_CACHE_ARGS="--mount type=bind,src=$cache_path,dst=/hf_cache -e HF_HOME=/hf_cache"
              RUN_PY_FLAGS="--no-clear-model-cache"
            else
              echo "HF cache does not exist: $cache_path"
            fi
          fi
        fi
        echo "hf_cache_args=$HF_CACHE_ARGS" >> $GITHUB_OUTPUT
        echo "run_py_flags=$RUN_PY_FLAGS" >> $GITHUB_OUTPUT
    
    - name: Run benchmarks
      shell: bash
      env:
        BENCHMARK_ONLY: ${{ inputs.benchmark_only }}
        RUN_PY_FLAGS: ${{ steps.hf_cache.outputs.run_py_flags }}
        INPUT_BENCHMARK_FLAGS: ${{ inputs.benchmark_flags }}
        GFX_ARCH: ${{ inputs.gfx_arch }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        ARCH: ${{ inputs.arch }}
        HF_CACHE_ARGS: ${{ steps.hf_cache.outputs.hf_cache_args }}
        HF_TOKEN: ${{ inputs.hf_token }}
        DOCKER_IMAGE: ${{ inputs.image }}
      run: |
        MIOPEN_USER_DB_PATH_ENV=""
        if [ "$BENCHMARK_ONLY" != "true" ]; then
          MIOPEN_USER_DB_PATH_ENV="-e MIOPEN_USER_DB_PATH=/app/diffusion-models-inference/data/miopen/userdb"
        fi
        
        EFFECTIVE_BENCHMARK_FLAGS="$RUN_PY_FLAGS $INPUT_BENCHMARK_FLAGS"
        if [ -n "$GFX_ARCH" ] && [[ "$EFFECTIVE_BENCHMARK_FLAGS" != *"--name"* ]]; then
          EFFECTIVE_BENCHMARK_FLAGS="${EFFECTIVE_BENCHMARK_FLAGS} --tag $GFX_ARCH"
        fi
        if [ "${{ inputs.collect_hipblaslt_logs }}" = "true" ]; then
          EFFECTIVE_BENCHMARK_FLAGS="${EFFECTIVE_BENCHMARK_FLAGS} --collect-hipblaslt-logs"
        fi
        
        docker run \
          --security-opt seccomp=unconfined \
          --device=/dev/kfd \
          --device=/dev/dri \
          --rm \
          --shm-size 128G \
          --name xdit-bench \
          --mount type=bind,src="$GITHUB_WORKSPACE/$OUTPUT_DIR/$ARCH",dst=/outputs \
          --mount type=bind,src="$(pwd)",dst=/app/diffusion-models-inference \
          --mount type=bind,src="$GITHUB_WORKSPACE/references",dst=/app/references \
          $HF_CACHE_ARGS \
          $MIOPEN_USER_DB_PATH_ENV \
          -e CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \
          -e OMP_NUM_THREADS=16 \
          -e HF_TOKEN="$HF_TOKEN" \
          -e BENCHMARK_FLAGS="${EFFECTIVE_BENCHMARK_FLAGS}" \
          "$DOCKER_IMAGE" \
          sh -c 'python3 /app/.ci/run.py $BENCHMARK_FLAGS /app/.ci/benchmark_configs/*.yaml && \
                 python3 /app/.ci/quality_check.py --reference-path /app/references --benchmark-output-path /outputs; \
                 amd-smi || rocm-smi || true'
    
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output_dir }}/${{ inputs.arch }}/**
