name: Run MIOpen Tuning
description: Run MIOpen kernel tuning for a specific architecture

inputs:
  image:
    description: 'Docker image to use for tuning'
    required: true
  arch:
    description: 'Architecture name (gfx942, gfx950)'
    required: true
  artifact_name:
    description: 'Full artifact name for upload'
    required: true
  miopen_find_mode:
    description: 'MIOpen find mode (integer)'
    required: false
    default: '1'
  miopen_find_enforce:
    description: 'MIOpen find enforce (integer)'
    required: false
    default: '3'
  force_retuning:
    description: 'Force full retuning (delete existing tuning databases before tuning)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run MIOpen tuning
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        FORCE_RETUNING: ${{ inputs.force_retuning }}
        MIOPEN_FIND_MODE: ${{ inputs.miopen_find_mode }}
        MIOPEN_FIND_ENFORCE: ${{ inputs.miopen_find_enforce }}
        DOCKER_IMAGE: ${{ inputs.image }}
      run: ${{ github.action_path }}/scripts/run-tuning.sh
    
    - name: Upload MIOpen tuning results
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact_name }}
        path: data/miopen/userdb/gfx*
    
    - name: Upload driver commands
      uses: actions/upload-artifact@v6
      with:
        name: drivercmd-${{ inputs.arch }}
        path: |
          drivercmd.txt
          drivercmd_filtered.txt
