name: Run MIOpen Tuning
description: Run MIOpen kernel tuning for a specific architecture

inputs:
  image:
    description: 'Docker image to use for tuning'
    required: true
  arch:
    description: 'Architecture name (mi300, mi308, mi325, mi350, mi355)'
    required: true
  artifact_name:
    description: 'Full artifact name for upload'
    required: true
  miopen_find_mode:
    description: 'MIOpen find mode (integer)'
    required: false
    default: '1'
  miopen_find_enforce:
    description: 'MIOpen find enforce (integer)'
    required: false
    default: '3'
  force_retuning:
    description: 'Force full retuning (delete existing tuning databases before tuning)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run MIOpen tuning
      shell: bash
      run: |
        docker run \
          --cap-add=SYS_PTRACE \
          --security-opt seccomp=unconfined \
          --user root \
          --device=/dev/kfd \
          --device=/dev/dri \
          --group-add video \
          --ipc=host \
          --network host \
          --rm \
          --privileged \
          --shm-size 128G \
          --name miopen-tune \
          --mount type=bind,src="$(pwd)",dst=/app/diffusion-models-inference \
          -e HIP_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \
          -e OMP_NUM_THREADS=16 \
          -e ARCH=${{ inputs.arch }} \
          -e FORCE_RETUNING=${{ inputs.force_retuning }} \
          -e MIOPEN_USER_DB_PATH=/app/diffusion-models-inference/data/miopen/userdb \
          -e MIOPEN_FIND_MODE=${{ inputs.miopen_find_mode }} \
          -e MIOPEN_FIND_ENFORCE=${{ inputs.miopen_find_enforce }} \
          -e HOST_UID=$(id -g) \
          ${{ inputs.image }} \
          bash -c "/app/diffusion-models-inference/data/miopen/tune.sh"
    
    - name: Upload MIOpen tuning results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: data/miopen/userdb/gfx*
    
    - name: Upload driver commands
      uses: actions/upload-artifact@v4
      with:
        name: drivercmd-${{ inputs.arch }}
        path: |
          drivercmd.txt
          drivercmd_filtered.txt
