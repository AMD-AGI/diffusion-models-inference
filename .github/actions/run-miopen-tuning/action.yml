name: Run MIOpen Tuning
description: Run MIOpen kernel tuning for a specific architecture

inputs:
  image:
    description: 'Docker image to use for tuning'
    required: true
  arch:
    description: 'GPU tag from matrix (e.g., gfx942, mi300, gfx950)'
    required: true
  artifact_name:
    description: 'Full artifact name for the validated MIOpen DB files'
    required: true
  force_retuning:
    description: 'Tune every workload problem from an empty DB'
    required: false
    default: 'false'
  brr_priority:
    description: 'brr scheduling priority: low, normal, or high (defaults to low)'
    required: false
    default: 'low'
  disable_brr:
    description: 'Disable brr'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run MIOpen tuning
      id: tune
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        FORCE_RETUNING: ${{ inputs.force_retuning }}
        DOCKER_IMAGE: ${{ inputs.image }}
        DISABLE_BRR: ${{ inputs.disable_brr }}
        BRR_PRIORITY: ${{ inputs.brr_priority }}
        WITH_BRR: ${{ github.workspace }}/.github/scripts/with-brr.sh
      run: ${{ github.action_path }}/scripts/run-tuning.sh

    - name: Write MIOpen tuning summary
      if: always()
      shell: bash
      run: |
        if [ -f miopen-run/summary.md ]; then
          cat miopen-run/summary.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## MIOpen tuning" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload MIOpen tuning report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: miopen-report-${{ inputs.artifact_name }}
        path: miopen-run/
        if-no-files-found: warn

    - name: Resolve validated MIOpen DB files
      id: db-files
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from pathlib import Path

        report = json.loads(Path("miopen-run/report.json").read_text())
        if report["status"] != "passed":
            raise SystemExit("MIOpen tuning report did not pass")
        paths = [Path(path) for path in report["db"]["files"]]
        missing = [str(path) for path in paths if not path.is_file()]
        if missing:
            raise SystemExit(f"Validated DB files are missing: {missing}")
        print("paths<<EOF")
        for path in paths:
            print(path.relative_to(Path.cwd()))
        print("EOF")
        PY

    - name: Upload validated MIOpen DB files
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ steps.db-files.outputs.paths }}
        if-no-files-found: error
