name: Run MIOpen Tuning
description: Run MIOpen kernel tuning for a specific architecture

inputs:
  image:
    description: 'Docker image to use for tuning'
    required: true
  arch:
    description: 'GPU tag from matrix (e.g., gfx942, mi300, gfx950)'
    required: true
  artifact_name:
    description: 'Full artifact name for upload'
    required: true
  force_retuning:
    description: 'Force full retuning (delete existing tuning databases before tuning)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run MIOpen tuning
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        FORCE_RETUNING: ${{ inputs.force_retuning }}
        DOCKER_IMAGE: ${{ inputs.image }}
      run: ${{ github.action_path }}/scripts/run-tuning.sh
    
    - name: Resolve DB prefix
      id: db-prefix
      shell: bash
      run: |
        if [ -f .miopen_db_prefix ]; then
          echo "prefix=$(cat .miopen_db_prefix)" >> $GITHUB_OUTPUT
        else
          echo "::warning::No DB prefix resolved, falling back to arch glob"
          echo "prefix=${{ inputs.arch }}" >> $GITHUB_OUTPUT
        fi

    - name: Upload MIOpen tuning results
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact_name }}
        path: data/miopen/userdb/${{ steps.db-prefix.outputs.prefix }}*
    
    - name: Upload driver commands
      uses: actions/upload-artifact@v6
      with:
        name: drivercmd-${{ inputs.arch }}
        path: |
          drivercmd.txt
          drivercmd_filtered.txt
