name: Run xDiT hardware tests
description: Run a ROCm-compatible xDiT accelerator test suite
inputs:
  image:
    description: Image containing the xDiT checkout
    required: true
  arch:
    description: GPU runner label
    required: true
  suite:
    description: Test suite, single or multi
    required: true
  brr_priority:
    description: brr scheduling priority
    default: low
  disable_brr:
    description: Disable brr
    default: 'false'
  artifact_name:
    description: Test results artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Run accelerator tests
      shell: bash
      env:
        DOCKER_IMAGE: ${{ inputs.image }}
        ARCH: ${{ inputs.arch }}
        XDIT_TEST_SUITE: ${{ inputs.suite }}
        BRR_PRIORITY: ${{ inputs.brr_priority }}
        DISABLE_BRR: ${{ inputs.disable_brr }}
        WITH_BRR: ${{ github.workspace }}/.github/scripts/with-brr.sh
      run: ${{ github.action_path }}/scripts/run-xdit-hw-tests.sh
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact_name }}
        path: xdit-hw-tests/${{ inputs.arch }}/${{ inputs.suite }}.xml
        if-no-files-found: warn
