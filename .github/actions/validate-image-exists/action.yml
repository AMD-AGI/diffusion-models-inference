name: 'Validate Image Exists'
description: 'Checks if a Docker image exists in the registry'
inputs:
  image:
    description: 'Full image name with tag to validate'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Validate image exists
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        IMAGE=$(echo "$IMAGE" | xargs)
        
        echo "Checking if image exists: ${IMAGE}"
        if ! docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
          echo "Error: image ${IMAGE} does not exist"
          exit 1
        fi
        echo "${IMAGE} exists"
