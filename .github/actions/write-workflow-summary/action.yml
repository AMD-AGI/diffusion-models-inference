name: Write Step Summary
description: Generates a markdown summary with multiple customizable sections

inputs:
  title:
    description: 'Main title for the summary'
    required: false
    default: 'Workflow Configuration'
  text:
    description: 'Plain text content to display below the title'
    required: false
    default: ''
  tables:
    description: 'JSON object where keys are section titles and values are data objects to display as tables'
    required: false
    default: '{}'
  code:
    description: 'JSON object where keys are section titles and values are data objects to display as code blocks'
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Generate summary
      shell: bash
      env:
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_TABLES: ${{ inputs.tables }}
        INPUT_CODE: ${{ inputs.code }}
      run: ${{ github.action_path }}/scripts/generate-summary.sh
