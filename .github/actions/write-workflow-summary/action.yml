name: Write Step Summary
description: Generates a markdown summary with multiple customizable sections

inputs:
  title:
    description: 'Main title for the summary'
    required: false
    default: 'Workflow Configuration'
  text:
    description: 'Plain text content to display below the title'
    required: false
    default: ''
  tables:
    description: 'JSON object where keys are section titles and values are data objects to display as tables'
    required: false
    default: '{}'
  code:
    description: 'JSON object where keys are section titles and values are data objects to display as code blocks'
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Generate summary
      shell: bash
      env:
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_TABLES: ${{ inputs.tables }}
        INPUT_CODE: ${{ inputs.code }}
      run: |
        echo "## ${INPUT_TITLE}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Process text content
        if [ -n "${INPUT_TEXT}" ]; then
          echo "${INPUT_TEXT}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Process table sections
        echo "${INPUT_TABLES}" | jq -c 'to_entries[]' | while IFS= read -r section; do
          TITLE=$(echo "$section" | jq -r '.key')
          DATA=$(echo "$section" | jq -c '.value')
          
          echo "### $TITLE" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "$DATA" | jq -r 'to_entries | .[] | "| \(.key) | \(if .value then "`\(.value | tostring)`" else "" end) |"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        done
        
        # Process code sections
        echo "${INPUT_CODE}" | jq -c 'to_entries[]' | while IFS= read -r section; do
          TITLE=$(echo "$section" | jq -r '.key')
          DATA=$(echo "$section" | jq -c '.value')
          
          echo "### $TITLE" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$DATA" | jq . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        done
