#
# Trivy secret-scan allow rules for the SGL-D CUDA image only
# (docker/Dockerfile.sgld.cuda), which is built on lmsysorg/sglang. The build
# appends these rules to trivy-secret.yaml for that image, so they never hide
# findings in any other image. See README.md in this directory before editing.
#
# This file holds only an allow-rules list of "  - id:" items; the merge fails
# on anything else, and on rule ids that already exist in trivy-secret.yaml.

allow-rules:
  - id: cpython-testsuite-certdata
    description: >-
      Public TLS test keys from CPython's Lib/test/certdata, installed by the
      Ubuntu libpython3.12-testsuite package in the lmsysorg/sglang base image.
    path: ^usr/lib/python3\.[0-9]+/test/certdata/(allsans|badcert|idnsans|keycert|keycert\.passwd|keycert2|keycert3|keycert4|keycertecc|nosan|pycakey|ssl_key|ssl_key\.passwd)\.pem$

  - id: lmsysorg-sglang-base-ssh-host-keys
    description: >-
      SSH host keys that openssh-server generated while lmsysorg/sglang was
      built upstream, so every pull of that tag ships the same public copy.
      They protect nothing of ours. Dockerfile.sgld.cuda deletes them so the
      runtime image never serves them.
    path: ^etc/ssh/ssh_host_(ecdsa|ed25519|rsa)_key$

  - id: pycryptodomex-selftest-key-fixtures-sglang-venv
    description: >-
      Public RSA, DSA and ECC test keys shipped in pycryptodomex 3.23.0 in the
      lmsysorg/sglang /opt/sglang environment. Only the reported Cryptodome
      SelfTest modules and their bytecode are covered. The path does not pin
      the version; re-review this rule when the lmsysorg/sglang base is bumped.
    path: ^opt/sglang/lib/python3\.[0-9]+/site-packages/Cryptodome/SelfTest/(Cipher/(test_pkcs1_15\.py|__pycache__/test_pkcs1_15\.cpython-[0-9]+\.pyc)|Protocol/(test_ecdh\.py|__pycache__/test_ecdh\.cpython-[0-9]+\.pyc)|PublicKey/(test_import_(DSA|ECC|RSA)\.py|__pycache__/test_import_(DSA|ECC|RSA)\.cpython-[0-9]+\.pyc)|Signature/(test_(pkcs1_15|pss)\.py|__pycache__/test_(pkcs1_15|pss)\.cpython-[0-9]+\.pyc))$

  - id: tornado-test-key-sglang-venv
    description: >-
      Public TLS test private key shipped in the tornado 6.6a1 wheel in the
      lmsysorg/sglang /opt/sglang environment. The path does not pin the
      version; re-review this rule when the lmsysorg/sglang base is bumped.
    path: ^opt/sglang/lib/python3\.[0-9]+/site-packages/tornado/test/test\.key$

  - id: rust-crate-tls-test-fixtures
    description: >-
      Public TLS test keys from the tokio-rustls 0.26.4 and ureq 2.12.1 crate
      sources, left in the cargo registry of the lmsysorg/sglang base image.
    path: ^root/\.cargo/registry/src/index\.crates\.io-[0-9a-f]+/(tokio-rustls-0\.26\.4/tests/certs/end\.key|ureq-2\.12\.1/tests/https-agent\.rs)$
