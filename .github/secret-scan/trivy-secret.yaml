#
# Trivy secret-scan policy for every image and build cache pushed by CI.
# See README.md in this directory before editing.
#
# The scan always reads this file from the default branch, so a merged change
# applies to "Re-run failed jobs" of an already failed secret-scan job.
#
# Paths are relative to the extracted layer, with no leading slash
# (e.g. "usr/lib/..."). ".git" directories appear as ".git-dir", and image
# configs and cache metadata appear as "blob.json".
#
# Trivy evaluates "regex" against the whole rule match, which can include the
# characters around the secret (use \b, not ^...$), and "path" against the
# file path. The two are independent: a rule with both fields allows either.
# Prefer an exact "regex" for a known public value; a "path" rule hides every
# secret in the matching files.

# Trivy's built-in allow rules skip whole trees such as site-packages,
# usr/share, tests and markdown, which is where leaked credentials in an image
# usually live. They are all disabled; every exception is listed below.
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log

allow-rules:
  - id: hf-public-ci-token
    description: >-
      Public read-only Hugging Face CI token hard-coded in transformers
      testing_utils.py and diffusers tests/others/test_utils.py.
    regex: \bhf_94wBhPGp6KrrTH3KDchhKpRxZwd6dmHWLL\b

  - id: miopen-model-weights
    description: >-
      MIOpen tuning model weights; base64 weight data matches the Twilio API
      key pattern.
    path: ^opt/rocm[^/]*/(.+/)?share/miopen/db/[^/]+\.model$
