#
# Trivy secret-scan policy for every image and build cache pushed by CI.
# See README.md in this directory before editing.
#
# Build workflows read this file from the triggering branch, so a pushed
# policy change applies to a rerun of an already failed job.
#
# Paths are relative to the extracted layer, with no leading slash
# (e.g. "usr/lib/..."). ".git" directories appear as ".git-dir", and image
# configs and cache metadata appear as "blob.json".
#
# Trivy evaluates "regex" against the whole rule match, which can include the
# characters around the secret (use \b, not ^...$), and "path" against the
# file path. The two are independent: a rule with both fields allows either.
# Prefer an exact "regex" for a known public value; a "path" rule hides every
# secret in the matching files.

# Trivy's built-in allow rules skip whole trees such as site-packages,
# usr/share, tests and markdown, which is where leaked credentials in an image
# usually live. They are all disabled; every exception is listed below.
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log

allow-rules:
  - id: hf-public-ci-token
    description: >-
      Public read-only Hugging Face CI token hard-coded in transformers
      testing_utils.py and diffusers tests/others/test_utils.py.
    regex: \bhf_94wBhPGp6KrrTH3KDchhKpRxZwd6dmHWLL\b

  - id: miopen-model-weights
    description: >-
      MIOpen tuning model weights; base64 weight data matches the Twilio API
      key pattern.
    path: ^opt/rocm[^/]*/(.+/)?share/miopen/db/[^/]+\.model$

  - id: miopen-model-weights-rocm-sdk-wheels
    description: >-
      MIOpen tuning model weights (share/miopen/db/*.model) from the TheRock
      rocm-sdk-device-<gfx> wheels. "rocm-sdk init" hardlinks them into the
      rocm-sdk-devel tree, so the layer can show either path. The files are
      JSON Keras models; base64 weight data matches the Twilio API key
      pattern. Same files as miopen-model-weights, at the wheel install path.
    path: ^venv/lib/python3\.[0-9]+/site-packages/_rocm_sdk_(devel|libraries)/share/miopen/db/[^/]+\.model$

  - id: aws-documentation-example-key-ids
    description: >-
      AWS documentation placeholder access key IDs such as
      AKIAIOSFODNN7EXAMPLE, used throughout the boto3 and botocore examples.
      AWS reserves the EXAMPLE suffix for documentation values.
    regex: \b(AKIA|ASIA|AIDA|AROA|AGPA|AIPA|ANPA|ANVA|A3T[A-Z0-9])[A-Z0-9]{9}EXAMPLE\b

  - id: dynolog-third-party-test-keys
    description: >-
      Public test and documentation private keys committed to cpr and civetweb,
      vendored by dynolog in the PyTorch kineto submodule of the TheRock source
      tree kept in the core build cache.
    path: >-
      /third_party/dynolog/third_party/(cpr/test/data/keys/[^/]+\.key|prometheus-cpp/3rdparty/civetweb/(resources/(cert/[^/]+\.(key|key\.orig|pem)|ssl_cert\.pem)|docs/OpenSSL\.md))$

  - id: tornado-test-key
    description: >-
      Public TLS test private key shipped in the tornado wheel.
    path: ^usr/local/lib/python3\.[0-9]+/(dist|site)-packages/tornado/test/test\.key$

  - id: diffusers-vq-diffusion-public-sas
    description: >-
      Public read-only SAS URL for the released Improved VQ-Diffusion checkpoint,
      documented in diffusers scripts/convert_vq_diffusion_to_diffusers.py.
    regex: sig=GOE%2Bza02%2FPnGxYVOOPtwrTR4RA3%2F5NVgMxdW4kjaEZ8%3D

  - id: anthropic-agent-identity-documentation
    description: >-
      Anthropic 2.10.0 agent API docstrings describe the default execution
      identity as {"type": "service_account"}, without any credentials.
      Covers the reported source files and compiled agents.py docstrings.
      The path does not pin the version, so a later anthropic release in the
      same files stays allowed; re-review this rule when anthropic is bumped.
    path: ^venv/lib/python3\.[0-9]+/site-packages/anthropic/(resources/beta/agents/(agents\.py|__pycache__/agents\.cpython-[0-9]+\.pyc)|types/beta/(agent_create_params|agent_update_params|beta_managed_agents_agent|beta_managed_agents_session_agent|beta_managed_agents_session_thread_agent)\.py)$

  - id: pycryptodomex-selftest-key-fixtures
    description: >-
      Public RSA, DSA and ECC test keys shipped in pycryptodomex 3.24.2.
      Only the seven reported Cryptodome SelfTest modules and their bytecode
      are covered, not the runtime cryptography implementation. The path does
      not pin the version; re-review this rule when pycryptodomex is bumped.
    path: ^venv/lib/python3\.[0-9]+/site-packages/Cryptodome/SelfTest/(Cipher/(test_pkcs1_15\.py|__pycache__/test_pkcs1_15\.cpython-[0-9]+\.pyc)|Protocol/(test_ecdh\.py|__pycache__/test_ecdh\.cpython-[0-9]+\.pyc)|PublicKey/(test_import_(DSA|ECC|RSA)\.py|__pycache__/test_import_(DSA|ECC|RSA)\.cpython-[0-9]+\.pyc)|Signature/(test_(pkcs1_15|pss)\.py|__pycache__/test_(pkcs1_15|pss)\.cpython-[0-9]+\.pyc))$

  - id: pyjwt-documentation-example
    description: >-
      PyJWT 2.15.1 METADATA quick-start token encoding {"some": "payload"}
      with the documented example signing key "secret".
    regex: \beyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzb21lIjoicGF5bG9hZCJ9\.4twFt5NiznN84AWoo1d7KO1T_yoc0Z6XOpOVswacPZg\b

  - id: skimage-public-grass-image-token
    description: >-
      Public single-image download JWT in scikit-image 0.25.2
      skimage/data/_fetchers.py grass() documentation, not an account credential.
    regex: \beyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9\.\.98hIcOTCqXWQ67Ec5bM5eovKEn2p91mWB3uedH61ynI\b
