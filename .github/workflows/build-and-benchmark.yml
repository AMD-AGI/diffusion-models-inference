name: Build and Benchmark xDiT

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'Git branch to build from'
        required: true
        default: 'main'
      image_tag_suffix:
        description: 'Custom tag suffix for built images'
        required: false
        default: ''
      prebuilt_core_image_tag:
        description: 'Prebuilt core image tag (skips core build)'
        required: false
        default: ''
      prebuilt_untuned_image_tag:
        description: 'Prebuilt untuned image tag (skips core and untuned builds)'
        required: false
        default: ''
      quality_check:
        description: 'Enable quality checks after benchmarks'
        type: boolean
        required: false
        default: true
      benchmark_flags:
        description: 'Flags used to filter benchmarks, leave empty to run all. Example, to run only release benchmarks: --tag release'
        required: false
        default: ''
      benchmark_image_tag:
        description: 'Tag of tuned image for benchmark-only mode'
        required: false
        default: ''
      allocator_id:
        description: 'Allocator reservation ID'
        required: false
        default: ''
      allocator_reservation_hours:
        description: 'Allocator reservation length in hours'
        required: false
        default: '4'
      mi300_allocator_reserve:
        description: 'MI300 reserve from Allocator'
        type: boolean
        required: false
        default: false
      mi300_is_allocator_node:
        description: 'MI300 runner is a Standard runner'
        type: boolean
        required: false
      mi300_is_allocator_pool:
        description: 'MI300 runner is a Standard runner'
        type: boolean
        required: false
      mi300_runner:
        description: 'MI300 runner (label or node/pool name)'
        required: false
        default: ''
      mi325_allocator_reserve:
        description: 'MI325 reserve from Allocator'
        type: boolean
        required: false
        default: false
      mi325_is_allocator_node:
        description: 'MI325 runner is a Standard runner'
        type: boolean
        required: false
      mi325_is_allocator_pool:
        description: 'MI325 runner is a Standard runner'
        type: boolean
        required: false
      mi325_runner:
        description: 'MI325 runner (label or node/pool name)'
        required: false
        default: ''
      mi355_allocator_reserve:
        description: 'MI355 reserve from Allocator'
        type: boolean
        required: false
        default: false
      mi355_is_allocator_node:
        description: 'MI355 runner is a Standard runner'
        type: boolean
        required: false
      mi355_is_allocator_pool:
        description: 'MI355 runner is a Standard runner'
        type: boolean
        required: false
      mi355_runner:
        description: 'MI355 runner (label or node/pool name)'
        required: false
        default: ''

env:
  CORE_IMAGE: amdsiloai/pytorch-xdit-core
  STAGING_IMAGE: amdsiloai/pytorch-xdit-staging

jobs:
  validate:
    name: Validate inputs
    runs-on: build-only
    outputs:
      any_arch_enabled: ${{ steps.check-archs.outputs.any_enabled }}
      image_tag: ${{ steps.generate_tag.outputs.tag }}
      core_image_with_tag: ${{ steps.generate_tag.outputs.core_image_with_tag }}
      staging_image_with_tag: ${{ steps.generate_tag.outputs.staging_image_with_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
      
      - name: Generate image tag
        id: generate_tag
        run: |         
          IMAGE_TAG=$(git rev-parse --short HEAD)
          if [ -n "${{ inputs.image_tag_suffix }}" ]; then
            IMAGE_TAG="${IMAGE_TAG}-${{ inputs.image_tag_suffix }}"
          fi
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "core_image_with_tag=${{ env.CORE_IMAGE }}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "staging_image_with_tag=${{ env.STAGING_IMAGE }}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Check architectures
        id: check-archs
        run: |
          ANY_ENABLED=false
          if [ -n "${{ inputs.mi300_runner }}" ] || \
             [ -n "${{ inputs.mi325_runner }}" ] || \
             [ -n "${{ inputs.mi355_runner }}" ]; then
            ANY_ENABLED=true
          fi
          echo "any_enabled=${ANY_ENABLED}" >> $GITHUB_OUTPUT
          
          if [ "$ANY_ENABLED" = "false" ]; then
            echo "Error: No architectures enabled"
            exit 1
          fi
      
      - name: Validate Allocator parameters
        run: |
          if [ "${{ inputs.mi300_allocator_reserve }}" = "true" ] || \
             [ "${{ inputs.mi325_allocator_reserve }}" = "true" ] || \
             [ "${{ inputs.mi355_allocator_reserve }}" = "true" ]; then
            if [ -z "${{ inputs.allocator_id }}" ]; then
              echo "Error: Allocator enabled for at least one architecture but no ALLOCATOR_ID specified"
              exit 1
            fi
            if [ -z "${{ inputs.allocator_reservation_hours }}" ]; then
              echo "Error: Allocator enabled for at least one architecture but no ALLOCATOR_RESERVATION_HOURS specified"
              exit 1
            fi
            if ! [[ "${{ inputs.allocator_reservation_hours }}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Error: ALLOCATOR_RESERVATION_HOURS must be a positive integer"
              exit 1
            fi
          fi

          if [ "${{ inputs.mi300_is_allocator_node }}" = "true" ] && [ "${{ inputs.mi300_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI300 cannot be both a Standard runner and pool simultaneously"
            exit 1
          fi
          if [ "${{ inputs.mi325_is_allocator_node }}" = "true" ] && [ "${{ inputs.mi325_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI325 cannot be both a Standard runner and pool simultaneously"
            exit 1
          fi
          if [ "${{ inputs.mi355_is_allocator_node }}" = "true" ] && [ "${{ inputs.mi355_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI355 cannot be both a Standard runner and pool simultaneously"
            exit 1
          fi

          if [ "${{ inputs.mi300_allocator_reserve }}" = "true" ] && [ "${{ inputs.mi300_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI300 cannot reserve a Standard runner (only nodes can be reserved)"
            exit 1
          fi
          if [ "${{ inputs.mi325_allocator_reserve }}" = "true" ] && [ "${{ inputs.mi325_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI325 cannot reserve a Standard runner (only nodes can be reserved)"
            exit 1
          fi
          if [ "${{ inputs.mi355_allocator_reserve }}" = "true" ] && [ "${{ inputs.mi355_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI355 cannot reserve a Standard runner (only nodes can be reserved)"
            exit 1
          fi
      
      - name: Validate benchmark image exists
        if: ${{ inputs.benchmark_image_tag != '' }}
        run: |
          echo "Checking if benchmark image exists: ${{ env.STAGING_IMAGE }}:${{ inputs.benchmark_image_tag }}"
          if ! docker manifest inspect ${{ env.STAGING_IMAGE }}:${{ inputs.benchmark_image_tag }} > /dev/null 2>&1; then
            echo "Error: Benchmark image ${{ env.STAGING_IMAGE }}:${{ inputs.benchmark_image_tag }} does not exist"
            exit 1
          fi
          echo "Benchmark image verified"
      
      - name: Validate prebuilt untuned image exists
        if: ${{ inputs.prebuilt_untuned_image_tag != '' && inputs.benchmark_image_tag == '' }}
        run: |
          echo "Checking if prebuilt untuned image exists: ${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }}"
          if ! docker manifest inspect ${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }} > /dev/null 2>&1; then
            echo "Error: Prebuilt untuned image ${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }} does not exist"
            exit 1
          fi
          echo "Prebuilt untuned image verified"
      
      - name: Validate prebuilt core image exists
        if: ${{ inputs.prebuilt_core_image_tag != '' && inputs.prebuilt_untuned_image_tag == '' && inputs.benchmark_image_tag == '' }}
        run: |
          echo "Checking if prebuilt core image exists: ${{ env.CORE_IMAGE }}:${{ inputs.prebuilt_core_image_tag }}"
          if ! docker manifest inspect ${{ env.CORE_IMAGE }}:${{ inputs.prebuilt_core_image_tag }} > /dev/null 2>&1; then
            echo "Error: Prebuilt core image ${{ env.CORE_IMAGE }}:${{ inputs.prebuilt_core_image_tag }} does not exist"
            exit 1
          fi
          echo "Prebuilt core image verified"
      
      - name: Store build metadata
        run: |
          mkdir -p build-metadata
          cat > build-metadata/tags.json << EOF
          {
            "image_tag": "${{ steps.generate_tag.outputs.tag }}",
            "core_image_with_tag": "${{ steps.generate_tag.outputs.core_image_with_tag }}",
            "staging_image_with_tag": "${{ steps.generate_tag.outputs.staging_image_with_tag }}"
          }
          EOF
      
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-build-metadata
          path: build-metadata/
      
      - name: Extract version information
        run: |
          mkdir -p versions
          git rev-parse HEAD > versions/repository.txt
          if docker manifest inspect ${{ steps.generate_tag.outputs.core_image_with_tag }} > /dev/null 2>&1; then
            docker pull ${{ steps.generate_tag.outputs.core_image_with_tag }}
            docker create --name core ${{ steps.generate_tag.outputs.core_image_with_tag }}
            docker cp core:/opt/rocm/share/therock/ versions/ || true
            docker rm core
          else
            echo "Core image does not exist yet, skipping docker extraction"
          fi
      
      - name: Upload version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-versions
          path: versions/**
      
      - name: Write summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Workflow Configuration'
          tables: |
            {
              "Workflow Inputs": ${{ toJSON(inputs) }},
              "Architecture Check Results": ${{ toJSON(steps.check-archs.outputs) }},
              "Generated Tags": ${{ toJSON(steps.generate_tag.outputs) }}
            }

  build-core:
    name: Build core and untuned images
    needs: [validate]
    runs-on: build-only
    if: ${{ inputs.benchmark_image_tag == '' && inputs.prebuilt_untuned_image_tag == '' }}
    outputs:
      image_tag: ${{ needs.validate.outputs.image_tag }}
      core_image_with_tag: ${{ needs.validate.outputs.core_image_with_tag }}
      staging_image_with_tag: ${{ needs.validate.outputs.staging_image_with_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      
      - name: Build core image
        if: ${{ inputs.prebuilt_core_image_tag == '' }}
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: docker/Dockerfile.ci
          context: .
          target: core
          push: true
          tags: ${{ needs.validate.outputs.core_image_with_tag }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDKIT_STEP_LOG_MAX_SIZE=104857600
      
      - name: Pull prebuilt core image
        if: ${{ inputs.prebuilt_core_image_tag != '' }}
        run: docker pull ${{ env.CORE_IMAGE }}:${{ inputs.prebuilt_core_image_tag }}
      
      - name: Build untuned image
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: docker/Dockerfile.ci
          context: .
          push: true
          tags: ${{ needs.validate.outputs.staging_image_with_tag }}-temp
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDKIT_STEP_LOG_MAX_SIZE=104857600
          cache-from: ${{ inputs.prebuilt_core_image_tag != '' && format('{0}:{1}', env.CORE_IMAGE, inputs.prebuilt_core_image_tag) || '' }}
      
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-workspace
        with:
          images: ''
          containers: ''

  generate-matrix:
    name: Generate architecture matrix
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      allocator_matrix: ${{ steps.generate.outputs.allocator_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
      
      - name: Generate matrix
        id: generate
        uses: ./.github/actions/generate-architecture-matrix
        with:
          workflow_inputs: ${{ toJSON(inputs) }}
      
      - name: Write matrix summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Architecture Matrix'
          code: |
            {
              "Matrix Configuration": ${{ toJSON(fromJSON(steps.generate.outputs.matrix)) }}
            }

  allocate-allocator-resources:
    name: Allocate Allocator resources for ${{ matrix.arch }}
    needs: [generate-matrix]
    if: ${{ fromJSON(needs.generate-matrix.outputs.allocator_matrix).include[0] != null }}
    runs-on: jump-host
    concurrency:
      group: allocator-jump-host
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.allocator_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}

      - name: Generate JIT config for ${{ matrix.arch }}
        id: jit
        uses: ./.github/actions/generate-jit-config
        with:
          arch: ${{ matrix.arch }}
          runner: ${{ matrix.runner }}
          run_number: ${{ github.run_number }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}
      
      - name: Generate allocator configuration
        id: allocator_config
        uses: ./.github/actions/generate-allocator-config
        with:
          arch: ${{ matrix.arch }}
          jitconfig: ${{ steps.jit.outputs.jitconfig }}
          repository: ${{ github.repository }}
      
      - name: Allocate resources via Allocator
        id: allocate
        uses: ./.github/actions/allocate-allocator-resources
        with:
          arch: ${{ matrix.arch }}
          runner_or_pool: ${{ matrix.runner }}
          is_allocator_node: ${{ matrix.is_allocator_node }}
          is_allocator_pool: ${{ matrix.is_allocator_pool }}
          allocator_reserve: ${{ matrix.allocator_reserve }}
          allocator_id: ${{ inputs.allocator_id }}
          allocator_reservation_hours: ${{ inputs.allocator_reservation_hours }}
          amd_email: ${{ secrets.ALLOCATOR_AMD_EMAIL }}
          ats_secret: ${{ secrets.ALLOCATOR_ATS_SECRET }}
          run_number: ${{ github.run_number }}
      
      - name: Upload reservation metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-reservation-${{ matrix.arch }}
          path: reservation-metadata/

  tune-and-benchmark:
    name: ${{ matrix.arch }} tuning and benchmarking
    needs: [validate, generate-matrix, allocate-allocator-resources, build-core]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    if: |
      needs.validate.outputs.any_arch_enabled == 'true' && 
      !cancelled() && 
      (needs.allocate-allocator-resources.result == 'success' || needs.allocate-allocator-resources.result == 'skipped') &&
      (needs.build-core.result == 'success' || needs.build-core.result == 'skipped') &&
      (!failure() || inputs.benchmark_image_tag != '')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
          token: ${{ secrets.GH_PAT }}
          submodules: ${{ inputs.quality_check && 'recursive' || 'false' }}
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}

      - name: Load build metadata
        if: ${{ inputs.benchmark_image_tag == '' }}
        id: metadata
        uses: ./.github/actions/load-build-metadata
        with:
          run_number: ${{ github.run_number }}
      
      - name: Determine image to use
        id: image
        run: |
          if [ -n "${{ inputs.benchmark_image_tag }}" ]; then
            echo "used_image=${{ env.STAGING_IMAGE }}:${{ inputs.benchmark_image_tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.prebuilt_untuned_image_tag }}" ] && docker manifest inspect ${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }} > /dev/null 2>&1; then
            echo "used_image=${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "used_image=${{ steps.metadata.outputs.staging_image_with_tag }}-temp" >> $GITHUB_OUTPUT
          fi
      
      - name: Pull image
        run: docker pull ${{ steps.image.outputs.used_image }}
      
      - name: Run MIOpen tuning
        if: ${{ inputs.benchmark_image_tag == '' }}
        uses: ./.github/actions/run-miopen-tuning
        with:
          image: ${{ steps.image.outputs.used_image }}
          arch: ${{ matrix.arch }}
      
      - name: Upload MIOpen tuning results
        if: ${{ inputs.benchmark_image_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-miopen-${{ matrix.arch }}
          path: data/miopen/userdb/gfx*
      
      - name: Run benchmarks
        uses: ./.github/actions/run-benchmarks
        with:
          image: ${{ steps.image.outputs.used_image }}
          arch: ${{ matrix.arch }}
          gfx_arch: ${{ matrix.gfx_arch }}
          benchmark_flags: ${{ inputs.benchmark_flags }}
          benchmark_only: ${{ inputs.benchmark_image_tag != '' }}
          hf_token: ${{ secrets.HF_TOKEN }}
      
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-benchmarks-${{ matrix.arch }}
          path: benchmarks/${{ matrix.arch }}/**
      
      - name: Cleanup
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cleanup-workspace
        with:
          images: '${{ steps.image.outputs.used_image }}'
          containers: 'xdit-bench miopen-tune'
      
      - name: Cleanup Allocator resources
        if: (always() || cancelled()) && matrix.allocator_reserve == 'true'
        continue-on-error: true
        uses: ./.github/actions/cleanup-allocator
        with:
          arch: ${{ matrix.arch }}
          run_number: ${{ github.run_number }}
          amd_email: ${{ secrets.ALLOCATOR_AMD_EMAIL }}
          ats_secret: ${{ secrets.ALLOCATOR_ATS_SECRET }}
      
      - name: Delete JIT runner
        if: (always() || cancelled()) && (matrix.is_allocator_node == 'true' || matrix.is_allocator_pool == 'true')
        continue-on-error: true
        uses: ./.github/actions/delete-jit-runner
        with:
          runner: ${{ matrix.runner }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}
      
      - name: Delete reservation artifact
        if: (always() || cancelled()) && matrix.allocator_reserve == 'true'
        continue-on-error: true
        uses: ./.github/actions/delete-reservation-artifact
        with:
          arch: ${{ matrix.arch }}
          run_number: ${{ github.run_number }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}

  build-final:
    name: Build final tuned image
    needs: [validate, build-core, tune-and-benchmark]
    runs-on: build-only
    if: ${{ inputs.benchmark_image_tag == '' && !cancelled() && !failure() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
      
      - name: Load build metadata
        id: metadata
        uses: ./.github/actions/load-build-metadata
        with:
          run_number: ${{ github.run_number }}

      - name: Download all MIOpen artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.run_number }}-miopen-*
          merge-multiple: true
          path: data/miopen/userdb
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      
      - name: Determine untuned image
        id: untuned
        run: |
          if [ -n "${{ inputs.prebuilt_untuned_image_tag }}" ] && docker manifest inspect ${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }} > /dev/null 2>&1; then
            echo "tag=${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ steps.metadata.outputs.staging_image_with_tag }}-temp" >> $GITHUB_OUTPUT
          fi
      
      - name: Pull untuned image
        run: docker pull ${{ steps.untuned.outputs.tag }} || true
      
      - name: Build final tuned image
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: docker/Dockerfile.ci
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.staging_image_with_tag }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDKIT_STEP_LOG_MAX_SIZE=104857600
          cache-from: ${{ steps.untuned.outputs.tag }}
      
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-workspace
        with:
          images: '${{ steps.metadata.outputs.staging_image_with_tag }} ${{ env.STAGING_IMAGE }}:${{ inputs.prebuilt_untuned_image_tag }}'
          containers: 'core'

  cleanup-allocator-resources:
    name: Cleanup Allocator resources for ${{ matrix.arch }}
    needs: [generate-matrix, allocate-allocator-resources, tune-and-benchmark]
    runs-on: jump-host
    if: |
      (always() || cancelled()) &&
      (needs.tune-and-benchmark.result == 'cancelled' || needs.tune-and-benchmark.result == 'skipped') &&
      fromJSON(needs.generate-matrix.outputs.allocator_matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.allocator_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
      
      - name: Cleanup Allocator resources
        if: matrix.allocator_reserve == 'true'
        uses: ./.github/actions/cleanup-allocator
        with:
          arch: ${{ matrix.arch }}
          run_number: ${{ github.run_number }}
          amd_email: ${{ secrets.ALLOCATOR_AMD_EMAIL }}
          ats_secret: ${{ secrets.ALLOCATOR_ATS_SECRET }}
      
      - name: Delete JIT runner
        uses: ./.github/actions/delete-jit-runner
        with:
          runner: ${{ matrix.runner }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}


