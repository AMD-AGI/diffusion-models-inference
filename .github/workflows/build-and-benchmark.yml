name: Build and Benchmark xDiT

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'Git branch to build from (optional)'
        required: false
        default: ''
      image_tag_suffix:
        description: 'Custom tag suffix for built images'
        required: false
        default: ''
      prebuilt_core_image_tag:
        description: 'Prebuilt core image tag (skips core build)'
        required: false
        default: ''
      prebuilt_untuned_image_tag:
        description: 'Prebuilt untuned image tag (skips core and untuned builds)'
        required: false
        default: ''
      quality_check:
        description: 'Enable quality checks after benchmarks'
        type: boolean
        required: false
        default: true
      benchmark_flags:
        description: 'Flags used to filter benchmarks, leave empty to run all. Examples: --tag release; or --name CONFIG_NAME to run a specific named config.'
        required: false
        default: ''
      benchmark_image:
        description: 'Image tag or full Docker Hub path for benchmark-only mode'
        required: false
        default: ''
      :
        description: 'Image tag or full Docker Hub path for baseline comparison benchmarks (runs alongside normal benchmarks)'
        required: false
        default: ''
      skip_baseline_duplicate_check:
        description: 'Skip checking if baseline benchmarks already exist (force re-run)'
        type: boolean
        required: false
        default: false
      trigger_benchmark_metrics_refresh:
        description: 'Trigger benchmarking metrics refresh after completion'
        type: boolean
        required: false
        default: true
      allocator_id:
        description: 'Allocator reservation ID'
        required: false
        default: ''
      allocator_reservation_hours:
        description: 'Allocator reservation length in hours'
        required: false
        default: '4'
      mi300_allocator_reserve:
        description: 'MI300 reserve from Allocator'
        type: boolean
        required: false
        default: false
      mi300_is_allocator_node:
        description: 'MI300 runner is a Standard runner'
        type: boolean
        required: false
      mi300_is_allocator_pool:
        description: 'MI300 runner is a Standard runner'
        type: boolean
        required: false
      mi300_runner:
        description: 'MI300 runner (label or node/pool name)'
        required: false
        default: ''
      mi325_allocator_reserve:
        description: 'MI325 reserve from Allocator'
        type: boolean
        required: false
        default: false
      mi325_is_allocator_node:
        description: 'MI325 runner is a Standard runner'
        type: boolean
        required: false
      mi325_is_allocator_pool:
        description: 'MI325 runner is a Standard runner'
        type: boolean
        required: false
      mi325_runner:
        description: 'MI325 runner (label or node/pool name)'
        required: false
        default: ''
      mi355_allocator_reserve:
        description: 'MI355 reserve from Allocator'
        type: boolean
        required: false
        default: false
      mi355_is_allocator_node:
        description: 'MI355 runner is a Standard runner'
        type: boolean
        required: false
      mi355_is_allocator_pool:
        description: 'MI355 runner is a Standard runner'
        type: boolean
        required: false
      mi355_runner:
        description: 'MI355 runner (label or node/pool name)'
        required: false
        default: ''

env:
  CORE_IMAGE: amdsiloai/pytorch-xdit-core
  STAGING_IMAGE: amdsiloai/pytorch-xdit-staging

jobs:
  validate:
    name: Validate inputs
    runs-on: build-only
    outputs:
      any_arch_enabled: ${{ steps.check-archs.outputs.any_enabled }}
      image_tag: ${{ steps.generate_tag.outputs.tag }}
      core_image_with_tag: ${{ steps.generate_tag.outputs.core_image_with_tag }}
      staging_image_with_tag: ${{ steps.generate_tag.outputs.staging_image_with_tag }}
      : ${{ steps.determine_baseline.outputs. }}
      : ${{ steps.determine_baseline.outputs. }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}
      
      - name: Generate image tag
        id: generate_tag
        run: |         
          IMAGE_TAG=$(git rev-parse --short HEAD)
          IMAGE_TAG_SUFFIX=$(echo "${{ inputs.image_tag_suffix }}" | xargs)
          if [ -n "$IMAGE_TAG_SUFFIX" ]; then
            IMAGE_TAG="${IMAGE_TAG}-${IMAGE_TAG_SUFFIX}"
          fi
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "core_image_with_tag=${{ env.CORE_IMAGE }}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "staging_image_with_tag=${{ env.STAGING_IMAGE }}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Check architectures
        id: check-archs
        run: |
          MI300_RUNNER=$(echo "${{ inputs.mi300_runner }}" | xargs)
          MI325_RUNNER=$(echo "${{ inputs.mi325_runner }}" | xargs)
          MI355_RUNNER=$(echo "${{ inputs.mi355_runner }}" | xargs)
          
          ANY_ENABLED=false
          if [ -n "$MI300_RUNNER" ] || \
             [ -n "$MI325_RUNNER" ] || \
             [ -n "$MI355_RUNNER" ]; then
            ANY_ENABLED=true
          fi
          echo "any_enabled=${ANY_ENABLED}" >> $GITHUB_OUTPUT
          
          if [ "$ANY_ENABLED" = "false" ]; then
            echo "Error: No architectures enabled"
            exit 1
          fi
      
      - name: Validate Allocator parameters
        run: |
          if [ "${{ inputs.mi300_allocator_reserve }}" = "true" ] || \
             [ "${{ inputs.mi325_allocator_reserve }}" = "true" ] || \
             [ "${{ inputs.mi355_allocator_reserve }}" = "true" ]; then
            if [ -z "${{ inputs.allocator_id }}" ]; then
              echo "Error: Allocator enabled for at least one architecture but no ALLOCATOR_ID specified"
              exit 1
            fi
            if [ -z "${{ inputs.allocator_reservation_hours }}" ]; then
              echo "Error: Allocator enabled for at least one architecture but no ALLOCATOR_RESERVATION_HOURS specified"
              exit 1
            fi
            if ! [[ "${{ inputs.allocator_reservation_hours }}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Error: ALLOCATOR_RESERVATION_HOURS must be a positive integer"
              exit 1
            fi
          fi

          if [ "${{ inputs.mi300_is_allocator_node }}" = "true" ] && [ "${{ inputs.mi300_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI300 cannot be both a Standard runner and pool simultaneously"
            exit 1
          fi
          if [ "${{ inputs.mi325_is_allocator_node }}" = "true" ] && [ "${{ inputs.mi325_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI325 cannot be both a Standard runner and pool simultaneously"
            exit 1
          fi
          if [ "${{ inputs.mi355_is_allocator_node }}" = "true" ] && [ "${{ inputs.mi355_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI355 cannot be both a Standard runner and pool simultaneously"
            exit 1
          fi

          if [ "${{ inputs.mi300_allocator_reserve }}" = "true" ] && [ "${{ inputs.mi300_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI300 cannot reserve a Standard runner (only nodes can be reserved)"
            exit 1
          fi
          if [ "${{ inputs.mi325_allocator_reserve }}" = "true" ] && [ "${{ inputs.mi325_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI325 cannot reserve a Standard runner (only nodes can be reserved)"
            exit 1
          fi
          if [ "${{ inputs.mi355_allocator_reserve }}" = "true" ] && [ "${{ inputs.mi355_is_allocator_pool }}" = "true" ]; then
            echo "Error: MI355 cannot reserve a Standard runner (only nodes can be reserved)"
            exit 1
          fi
      
      - name: Validate prebuilt untuned image exists
        if: ${{ inputs.prebuilt_untuned_image_tag != '' && inputs.benchmark_image == '' }}
        run: |
          PREBUILT_UNTUNED_TAG=$(echo "${{ inputs.prebuilt_untuned_image_tag }}" | xargs)
          echo "Checking if prebuilt untuned image exists: ${{ env.STAGING_IMAGE }}:${PREBUILT_UNTUNED_TAG}"
          if ! docker manifest inspect ${{ env.STAGING_IMAGE }}:${PREBUILT_UNTUNED_TAG} > /dev/null 2>&1; then
            echo "Error: Prebuilt untuned image ${{ env.STAGING_IMAGE }}:${PREBUILT_UNTUNED_TAG} does not exist"
            exit 1
          fi
          echo "Prebuilt untuned image verified"
      
      - name: Validate prebuilt core image exists
        if: ${{ inputs.prebuilt_core_image_tag != '' && inputs.prebuilt_untuned_image_tag == '' && inputs.benchmark_image == '' }}
        run: |
          PREBUILT_CORE_TAG=$(echo "${{ inputs.prebuilt_core_image_tag }}" | xargs)
          echo "Checking if prebuilt core image exists: ${{ env.CORE_IMAGE }}:${PREBUILT_CORE_TAG}"
          if ! docker manifest inspect ${{ env.CORE_IMAGE }}:${PREBUILT_CORE_TAG} > /dev/null 2>&1; then
            echo "Error: Prebuilt core image ${{ env.CORE_IMAGE }}:${PREBUILT_CORE_TAG} does not exist"
            exit 1
          fi
          echo "Prebuilt core image verified"
      
      - name: Determine benchmark image
        id: determine_benchmark
        run: |
          BENCHMARK=$(echo "${{ inputs.benchmark_image }}" | xargs)
          if [ -z "$BENCHMARK" ]; then
            echo "benchmark_image=" >> $GITHUB_OUTPUT
            echo "benchmark_image_tag=" >> $GITHUB_OUTPUT
          elif [[ "$BENCHMARK" == *"/"* ]] || [[ "$BENCHMARK" == *":"* ]]; then
            echo "benchmark_image=${BENCHMARK}" >> $GITHUB_OUTPUT
            # Extract tag portion after colon, or use whole string if no colon
            if [[ "$BENCHMARK" == *":"* ]]; then
              TAG="${BENCHMARK##*:}"
            else
              TAG=""
            fi
            echo "benchmark_image_tag=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "benchmark_image=${{ env.STAGING_IMAGE }}:${BENCHMARK}" >> $GITHUB_OUTPUT
            echo "benchmark_image_tag=${BENCHMARK}" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate benchmark image exists
        if: ${{ inputs.benchmark_image != '' }}
        run: |
          BENCHMARK_IMAGE="${{ steps.determine_benchmark.outputs.benchmark_image }}"
          echo "Checking if benchmark image exists: ${BENCHMARK_IMAGE}"
          if ! docker manifest inspect ${BENCHMARK_IMAGE} > /dev/null 2>&1; then
            echo "Error: Benchmark image ${BENCHMARK_IMAGE} does not exist"
            exit 1
          fi
          echo "Benchmark image verified"
      
      - name: Determine baseline image
        id: determine_baseline
        run: |
          BASELINE=$(echo "${{ inputs. }}" | xargs)
          if [ -z "$BASELINE" ]; then
            echo "=" >> $GITHUB_OUTPUT
            echo "=" >> $GITHUB_OUTPUT
          elif [[ "$BASELINE" == *"/"* ]] || [[ "$BASELINE" == *":"* ]]; then
            echo "=${BASELINE}" >> $GITHUB_OUTPUT
            # Extract tag portion after colon, or use whole string if no colon
            if [[ "$BASELINE" == *":"* ]]; then
              TAG="${BASELINE##*:}"
            else
              TAG="$BASELINE"
            fi
            echo "=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "=${{ env.STAGING_IMAGE }}:${BASELINE}" >> $GITHUB_OUTPUT
            echo "=${BASELINE}" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate baseline image exists
        if: ${{ inputs. != '' }}
        run: |
          ="${{ steps.determine_baseline.outputs. }}"
          echo "Checking if baseline comparison image exists: ${}"
          if ! docker manifest inspect ${} > /dev/null 2>&1; then
            echo "Error: Baseline comparison image ${} does not exist"
            exit 1
          fi
          echo "Baseline comparison image verified"
      
      - name: Store build metadata
        run: |
          # Strip whitespace from all image-related values before storing in metadata
          IMAGE_TAG=$(echo "${{ steps.generate_tag.outputs.tag }}" | xargs)
          CORE_IMAGE_WITH_TAG=$(echo "${{ steps.generate_tag.outputs.core_image_with_tag }}" | xargs)
          STAGING_IMAGE_WITH_TAG=$(echo "${{ steps.generate_tag.outputs.staging_image_with_tag }}" | xargs)
          BENCHMARK_IMAGE=$(echo "${{ steps.determine_benchmark.outputs.benchmark_image }}" | xargs)
          BENCHMARK_IMAGE_TAG=$(echo "${{ steps.determine_benchmark.outputs.benchmark_image_tag }}" | xargs)
          =$(echo "${{ steps.determine_baseline.outputs. }}" | xargs)
          =$(echo "${{ steps.determine_baseline.outputs. }}" | xargs)
          PREBUILT_CORE_TAG=$(echo "${{ inputs.prebuilt_core_image_tag }}" | xargs)
          PREBUILT_UNTUNED_TAG=$(echo "${{ inputs.prebuilt_untuned_image_tag }}" | xargs)
          GIT_BRANCH=$(echo "${{ inputs.git_branch }}" | xargs)
          
          mkdir -p build-metadata
          cat > build-metadata/tags.json << EOF
          {
            "image_tag": "${IMAGE_TAG}",
            "core_image": "${{ env.CORE_IMAGE }}",
            "core_image_tag": "${IMAGE_TAG}",
            "core_image_with_tag": "${CORE_IMAGE_WITH_TAG}",
            "staging_image": "${{ env.STAGING_IMAGE }}",
            "staging_image_tag": "${IMAGE_TAG}",
            "staging_image_with_tag": "${STAGING_IMAGE_WITH_TAG}",
            "benchmark_image": "${BENCHMARK_IMAGE}",
            "benchmark_image_tag": "${BENCHMARK_IMAGE_TAG}",
            "": "${}",
            "": "${}",
            "prebuilt_core_image_tag": "${PREBUILT_CORE_TAG}",
            "prebuilt_untuned_image_tag": "${PREBUILT_UNTUNED_TAG}",
            "git_branch": "${GIT_BRANCH}"
          }
          EOF
      
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-build-metadata
          path: build-metadata/
      
      - name: Extract version information
        run: |
          mkdir -p versions
          git rev-parse HEAD > versions/repository.txt
          if docker manifest inspect ${{ steps.generate_tag.outputs.core_image_with_tag }} > /dev/null 2>&1; then
            docker pull ${{ steps.generate_tag.outputs.core_image_with_tag }}
            docker create --name core ${{ steps.generate_tag.outputs.core_image_with_tag }}
            docker cp core:/opt/rocm/share/therock/ versions/ || true
            docker rm core
          else
            echo "Core image does not exist yet, skipping docker extraction"
          fi
      
      - name: Upload version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-versions
          path: versions/**
      
      - name: Write summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Workflow Configuration'
          tables: |
            {
              "Workflow Inputs": ${{ toJSON(inputs) }},
              "Architecture Check Results": ${{ toJSON(steps.check-archs.outputs) }},
              "Generated Tags": ${{ toJSON(steps.generate_tag.outputs) }},
              "Baseline Image": ${{ toJSON(steps.determine_baseline.outputs) }}
            }

  build-core:
    name: Build core and untuned images
    needs: [validate]
    runs-on: build-only
    if: ${{ inputs.benchmark_image == '' && inputs.prebuilt_untuned_image_tag == '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}
      
      - name: Load build metadata
        id: metadata
        uses: ./.github/actions/load-build-metadata
        with:
          run_number: ${{ github.run_number }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}
      
      - name: Set up Docker Buildx with custom log size
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=104857600
          use: true
          cleanup: false
      
      - name: Build core image
        if: ${{ steps.metadata.outputs.prebuilt_core_image_tag == '' }}
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: docker/Dockerfile.ci
          context: .
          target: core
          push: true
          tags: ${{ steps.metadata.outputs.core_image_with_tag }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Pull prebuilt core image
        if: ${{ steps.metadata.outputs.prebuilt_core_image_tag != '' }}
        run: docker pull ${{ env.CORE_IMAGE }}:${{ steps.metadata.outputs.prebuilt_core_image_tag }}
      
      - name: Determine cache source
        id: cache
        run: |
          if [ -n "${{ steps.metadata.outputs.prebuilt_core_image_tag }}" ]; then
            echo "source=${{ env.CORE_IMAGE }}:${{ steps.metadata.outputs.prebuilt_core_image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "source=${{ steps.metadata.outputs.core_image_with_tag }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build untuned image
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: docker/Dockerfile.ci
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.staging_image_with_tag }}-temp
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: ${{ steps.cache.outputs.source }}
      
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-workspace
        with:
          images: ''
          containers: ''

  generate-matrix:
    name: Generate architecture matrix
    needs: [validate, build-core]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      (needs.build-core.result == 'success' || needs.build-core.result == 'skipped')
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      allocator_matrix: ${{ steps.generate.outputs.allocator_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}
      
      - name: Generate matrix
        id: generate
        uses: ./.github/actions/generate-architecture-matrix
        with:
          workflow_inputs: ${{ toJSON(inputs) }}
      
      - name: Write matrix summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Architecture Matrix'
          code: |
            {
              "Matrix Configuration": ${{ toJSON(fromJSON(steps.generate.outputs.matrix)) }}
            }

  allocate-allocator-resources:
    name: Allocate Allocator resources for ${{ matrix.arch }}
    needs: [generate-matrix]
    if: |
      !cancelled() &&
      needs.generate-matrix.result == 'success' &&
      fromJSON(needs.generate-matrix.outputs.allocator_matrix).include[0] != null
    runs-on: jump-host
    concurrency:
      group: allocator-jump-host
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.allocator_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}

      - name: Generate JIT config for ${{ matrix.arch }}
        id: jit
        uses: ./.github/actions/generate-jit-config
        with:
          arch: ${{ matrix.arch }}
          runner: ${{ matrix.runner }}
          run_number: ${{ github.run_number }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}
      
      - name: Generate allocator configuration
        id: allocator_config
        uses: ./.github/actions/generate-allocator-config
        with:
          arch: ${{ matrix.arch }}
          jitconfig: ${{ steps.jit.outputs.jitconfig }}
          repository: ${{ github.repository }}
      
      - name: Allocate resources via Allocator
        id: allocate
        uses: ./.github/actions/allocate-allocator-resources
        with:
          arch: ${{ matrix.arch }}
          runner_or_pool: ${{ matrix.runner }}
          is_allocator_node: ${{ matrix.is_allocator_node }}
          is_allocator_pool: ${{ matrix.is_allocator_pool }}
          allocator_reserve: ${{ matrix.allocator_reserve }}
          allocator_id: ${{ inputs.allocator_id }}
          allocator_reservation_hours: ${{ inputs.allocator_reservation_hours }}
          amd_email: ${{ secrets.ALLOCATOR_AMD_EMAIL }}
          ats_secret: ${{ secrets.ALLOCATOR_ATS_SECRET }}
          run_number: ${{ github.run_number }}
      
      - name: Upload reservation metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-reservation-${{ matrix.arch }}
          path: reservation-metadata/

  tune-and-benchmark:
    name: ${{ matrix.arch }} tuning and benchmarking
    needs: [validate, generate-matrix, allocate-allocator-resources, build-core]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    if: |
      needs.validate.outputs.any_arch_enabled == 'true' && 
      !cancelled() && 
      (needs.allocate-allocator-resources.result == 'success' || needs.allocate-allocator-resources.result == 'skipped') &&
      (needs.build-core.result == 'success' || needs.build-core.result == 'skipped') &&
      (!failure() || inputs.benchmark_image != '')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}
          token: ${{ secrets.GH_PAT }}
          submodules: ${{ inputs.quality_check && 'recursive' || 'false' }}
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}

      - name: Load build metadata
        id: metadata
        uses: ./.github/actions/load-build-metadata
        with:
          run_number: ${{ github.run_number }}
      
      - name: Determine image to use
        id: image
        run: |
          if [ -n "${{ steps.metadata.outputs.benchmark_image }}" ]; then
            echo "used_image=${{ steps.metadata.outputs.benchmark_image }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ steps.metadata.outputs.prebuilt_untuned_image_tag }}" ]; then
            echo "used_image=${{ env.STAGING_IMAGE }}:${{ steps.metadata.outputs.prebuilt_untuned_image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "used_image=${{ steps.metadata.outputs.staging_image_with_tag }}-temp" >> $GITHUB_OUTPUT
          fi
          
          echo "=${{ steps.metadata.outputs. }}" >> $GITHUB_OUTPUT
      
      - name: Pull image
        run: docker pull ${{ steps.image.outputs.used_image }}
      
      - name: Run MIOpen tuning
        if: ${{ steps.metadata.outputs.benchmark_image == '' }}
        uses: ./.github/actions/run-miopen-tuning
        with:
          image: ${{ steps.image.outputs.used_image }}
          arch: ${{ matrix.arch }}
      
      - name: Upload MIOpen tuning results
        if: ${{ steps.metadata.outputs.benchmark_image == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-miopen-${{ matrix.arch }}
          path: data/miopen/userdb/gfx*
      
      - name: Run benchmarks
        uses: ./.github/actions/run-benchmarks
        with:
          image: ${{ steps.image.outputs.used_image }}
          arch: ${{ matrix.arch }}
          gfx_arch: ${{ matrix.gfx_arch }}
          benchmark_flags: ${{ inputs.benchmark_flags }}
          benchmark_only: ${{ steps.image.outputs.benchmark_image != '' }}
          hf_token: ${{ secrets.HF_TOKEN }}
      
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-benchmarks-${{ matrix.arch }}
          path: benchmarks/${{ matrix.arch }}/**
      
      - name: Image cleanup
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cleanup-workspace
        with:
          images: '${{ steps.image.outputs.used_image }}'
          containers: 'xdit-bench miopen-tune'
          skip_workspace_cleanup: 'true'
      
      - name: Check if baseline benchmarks already exist
        id: check_baseline
        if: ${{ steps.image.outputs. != '' && !inputs.skip_baseline_duplicate_check }}
        uses: ./.github/actions/check-if-baseline-exists
        with:
          image: ${{ steps.metadata.outputs. }}
          gh_token: ${{ secrets.GH_PAT }}
      
      - name: Pull baseline image
        if: ${{ steps.image.outputs. != '' && (inputs.skip_baseline_duplicate_check || steps.check_baseline.outputs.exists != '1') }}
        run: docker pull ${{ steps.image.outputs. }}
      
      - name: Run baseline benchmarks
        if: ${{ steps.image.outputs. != '' && (inputs.skip_baseline_duplicate_check || steps.check_baseline.outputs.exists != '1') }}
        uses: ./.github/actions/run-benchmarks
        with:
          image: ${{ steps.image.outputs. }}
          arch: ${{ matrix.arch }}
          gfx_arch: ${{ matrix.gfx_arch }}
          benchmark_flags: ${{ inputs.benchmark_flags }}
          benchmark_only: true
          output_dir: ''
          hf_token: ${{ secrets.HF_TOKEN }}
      
      - name: Upload baseline benchmark results
        if: ${{ steps.image.outputs. != '' && (inputs.skip_baseline_duplicate_check || steps.check_baseline.outputs.exists != '1') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}--${{ matrix.arch }}-${{ steps.metadata.outputs. }}
          path: /${{ matrix.arch }}/**
      
      - name: Workspace cleanup
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cleanup-workspace
        with:
          images: '${{ steps.image.outputs. }}'
          containers: 'xdit-bench'
          skip_workspace_cleanup: 'false'
      
      - name: Cleanup Allocator resources
        if: (always() || cancelled()) && matrix.allocator_reserve == 'true'
        continue-on-error: true
        uses: ./.github/actions/cleanup-allocator
        with:
          arch: ${{ matrix.arch }}
          run_number: ${{ github.run_number }}
          amd_email: ${{ secrets.ALLOCATOR_AMD_EMAIL }}
          ats_secret: ${{ secrets.ALLOCATOR_ATS_SECRET }}
      
      - name: Delete JIT runner
        if: (always() || cancelled()) && (matrix.is_allocator_node == 'true' || matrix.is_allocator_pool == 'true')
        continue-on-error: true
        uses: ./.github/actions/delete-jit-runner
        with:
          runner: ${{ matrix.runner }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}
      
      - name: Delete reservation artifact
        if: (always() || cancelled()) && matrix.allocator_reserve == 'true'
        continue-on-error: true
        uses: ./.github/actions/delete-reservation-artifact
        with:
          arch: ${{ matrix.arch }}
          run_number: ${{ github.run_number }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}

  build-final:
    name: Build final tuned image
    needs: [validate, build-core, tune-and-benchmark]
    runs-on: build-only
    if: ${{ inputs.benchmark_image == '' && !cancelled() && !failure() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}
      
      - name: Load build metadata
        id: metadata
        uses: ./.github/actions/load-build-metadata
        with:
          run_number: ${{ github.run_number }}

      - name: Download all MIOpen artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.run_number }}-miopen-*
          merge-multiple: true
          path: data/miopen/userdb
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}
      
      - name: Set up Docker Buildx with custom log size
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=104857600
          use: true
          cleanup: false
      
      - name: Determine untuned image
        id: untuned
        run: |
          if [ -n "${{ steps.metadata.outputs.prebuilt_untuned_image_tag }}" ]; then
            echo "tag=${{ env.STAGING_IMAGE }}:${{ steps.metadata.outputs.prebuilt_untuned_image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ steps.metadata.outputs.staging_image_with_tag }}-temp" >> $GITHUB_OUTPUT
          fi
      
      - name: Pull untuned image
        run: docker pull ${{ steps.untuned.outputs.tag }} || true
      
      - name: Build final tuned image
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: docker/Dockerfile.ci
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.staging_image_with_tag }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: ${{ steps.untuned.outputs.tag }}
      
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-workspace
        with:
          images: '${{ steps.metadata.outputs.staging_image_with_tag }} ${{ env.STAGING_IMAGE }}:${{ steps.metadata.outputs.prebuilt_untuned_image_tag }}'
          containers: 'core'

  cleanup-allocator-resources:
    name: Cleanup Allocator resources for ${{ matrix.arch }}
    needs: [generate-matrix, allocate-allocator-resources, tune-and-benchmark]
    runs-on: jump-host
    if: |
      (always() || cancelled()) &&
      (needs.tune-and-benchmark.result == 'cancelled' || needs.tune-and-benchmark.result == 'skipped' || needs.tune-and-benchmark.result == 'failure') &&
      fromJSON(needs.generate-matrix.outputs.allocator_matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.allocator_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}
      
      - name: Cleanup Allocator resources
        if: matrix.allocator_reserve == 'true'
        uses: ./.github/actions/cleanup-allocator
        with:
          arch: ${{ matrix.arch }}
          run_number: ${{ github.run_number }}
          amd_email: ${{ secrets.ALLOCATOR_AMD_EMAIL }}
          ats_secret: ${{ secrets.ALLOCATOR_ATS_SECRET }}
      
      - name: Delete JIT runner
        uses: ./.github/actions/delete-jit-runner
        with:
          runner: ${{ matrix.runner }}
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GH_PAT }}

  trigger-benchmark-metrics-refresh:
    name: Trigger benchmark metrics refresh
    needs: [validate, tune-and-benchmark]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.validate.result == 'success' && inputs.trigger_benchmark_metrics_refresh }}
    steps:
      - name: Trigger benchmark metrics refresh workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run "Publish benchmark results to GitHub Pages" \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            --field source_branch="${{ inputs.git_branch || github.ref_name }}"

