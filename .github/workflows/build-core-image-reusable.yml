name: Build Core Images (Reusable)

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      image_tag:
        description: 'Image tag to use for built images'
        required: true
        type: string
      core_image_name:
        description: 'Core image name'
        required: false
        type: string
        default: 'amdsiloai/pytorch-xdit-core'
      staging_image_name:
        description: 'Staging image name'
        required: false
        type: string
        default: 'amdsiloai/pytorch-xdit-staging'
      cache_image_name:
        description: 'Repository holding the registry layer cache tags'
        required: false
        type: string
        default: 'amdsiloai/pytorch-xdit-buildcache'
      cache_scope:
        description: 'Cache scope override. Defaults to a slug of git_ref, so branch builds cannot overwrite the mainline cache.'
        required: false
        type: string
        default: ''
      prebuilt_core_image_tag:
        description: 'Prebuilt core image tag or full Docker Hub path to use as cache (skips core build if provided)'
        required: false
        type: string
        default: ''
      build_untuned_image:
        description: 'Whether to build the untuned image'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner label to use'
        required: false
        type: string
        default: ''
      disable_docker_cache:
        description: 'Disable Docker cache on core build (equivalent to --no-cache)'
        required: false
        type: boolean
        default: false
      export_docker_cache:
        description: 'Export the core build cache to the registry'
        required: false
        type: boolean
        default: true
      docker_build_args:
        description: 'Newline-separated Docker build arguments in KEY=VALUE form'
        required: false
        type: string
        default: ''
    outputs:
      core_image_with_tag:
        description: 'Full core image with tag'
        value: ${{ jobs.build.outputs.core_image_with_tag }}
      staging_image_with_tag:
        description: 'Full staging image with tag (untuned, with -temp suffix)'
        value: ${{ jobs.build.outputs.staging_image_with_tag }}
    secrets:
      DOCKERHUB_ORGANIZATION:
        description: 'Docker Hub username/organization'
        required: true
      DOCKERHUB_OAT:
        description: 'Docker Hub access token'
        required: true

jobs:
  build:
    name: Build images
    runs-on: ${{ inputs.runner || 'build-only' }}
    timeout-minutes: 1440
    # Everything this job pushes lands on candidate tags in the private cache
    # repository; the Trivy scan step promotes it only after it passes.
    env:
      CANDIDATE_TAG: cand-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      core_image_with_tag: ${{ steps.set_outputs.outputs.core_image_with_tag }}
      staging_image_with_tag: ${{ steps.set_outputs.outputs.staging_image_with_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}
      
      - name: Determine images to build
        id: images
        env:
          PREBUILT_CORE_TAG_INPUT: ${{ inputs.prebuilt_core_image_tag }}
          CORE_IMAGE_NAME: ${{ inputs.core_image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          PREBUILT_CORE_TAG=$(echo "$PREBUILT_CORE_TAG_INPUT" | xargs)
          
          if [ -n "$PREBUILT_CORE_TAG" ]; then
            echo "skip_core_build=true" >> $GITHUB_OUTPUT
            # Check if tag contains "/" or ":", and if it does, assume it's a full Docker Hub path
            if [[ "$PREBUILT_CORE_TAG" == *"/"* ]] || [[ "$PREBUILT_CORE_TAG" == *":"* ]]; then
              echo "cache_source=${PREBUILT_CORE_TAG}" >> $GITHUB_OUTPUT
            else
              echo "cache_source=${CORE_IMAGE_NAME}:${PREBUILT_CORE_TAG}" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip_core_build=false" >> $GITHUB_OUTPUT
            echo "cache_source=${CORE_IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          fi
      
      # The core build is the only step in the pipeline that exports cache. Its
      # expensive stages (build_rocm, build_torch_stack, ffmpeg_builder) never
      # reach the final image, so only a mode=max registry export can describe
      # them; the untuned and tuned builds import what this step writes.
      - name: Resolve core build cache
        id: core_cache
        if: ${{ steps.images.outputs.skip_core_build == 'false' }}
        uses: ./.github/actions/resolve-build-cache
        with:
          cache_image_name: ${{ inputs.cache_image_name }}
          channel: 'core'
          ref: ${{ inputs.git_ref }}
          cache_scope: ${{ inputs.cache_scope }}
          extra_cache_from: ${{ steps.images.outputs.cache_source }}
          export: ${{ inputs.export_docker_cache }}
          export_tag: ${{ env.CANDIDATE_TAG }}-corecache-${{ inputs.image_tag }}
          disable_cache: ${{ inputs.disable_docker_cache }}

      - name: Build core image
        id: build_core
        if: ${{ steps.images.outputs.skip_core_build == 'false' }}
        env:
          BUILDKIT_PROGRESS: plain
          DISABLE_CACHE: ${{ inputs.disable_docker_cache }}
          DOCKER_BUILD_ARGS: ${{ inputs.docker_build_args }}
          CANDIDATE_IMAGE: ${{ inputs.cache_image_name }}:${{ env.CANDIDATE_TAG }}-core-${{ inputs.image_tag }}
          CACHE_FROM_FLAGS: ${{ steps.core_cache.outputs.cache_from_flags }}
          CACHE_TO_FLAG: ${{ steps.core_cache.outputs.cache_to_flag }}
          EXPORT_CACHE: ${{ inputs.export_docker_cache }}
          EXPORT_REF: ${{ steps.core_cache.outputs.export_ref }}
        run: |
          # A ref checked out from before secret scanning has a cache action
          # that ignores export_tag and would export straight to the live ref.
          if [ "${EXPORT_CACHE}" = "true" ] && { [ -z "${EXPORT_REF}" ] || [[ "${CACHE_TO_FLAG}" != *"ref=${EXPORT_REF},"* ]] || [[ "${EXPORT_REF}" != *":${CANDIDATE_TAG}-"* ]]; }; then
            echo "::error::The checked-out ref does not export cache to a secret scan candidate. Disable export_docker_cache or update the ref."
            exit 1
          fi


          BUILD_ARGS=()
          while IFS= read -r build_arg; do
            [[ -z "${build_arg}" ]] && continue
            if [[ ! "${build_arg}" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]] || [[ "${build_arg}" == *$'\r'* ]]; then
              echo "::error::Invalid Docker build argument syntax"
              exit 1
            fi
            BUILD_ARGS+=(--build-arg "${build_arg}")
          done <<< "${DOCKER_BUILD_ARGS}"

          NO_CACHE_FLAG=""
          if [ "${DISABLE_CACHE}" = "true" ]; then
            NO_CACHE_FLAG="--no-cache"
          fi

          # The export runs even under --no-cache, which makes a disabled-cache
          # run the way to replace a stale cache rather than something the cache
          # needs protecting from.
          docker buildx build \
            --builder "${BUILDX_BUILDER:?BUILDX_BUILDER is required}" \
            -f docker/Dockerfile.ci \
            --target core \
            --pull \
            --push \
            ${NO_CACHE_FLAG} \
            ${CACHE_FROM_FLAGS} \
            ${CACHE_TO_FLAG} \
            "${BUILD_ARGS[@]}" \
            --metadata-file "${RUNNER_TEMP}/core-build-metadata.json" \
            -t "${CANDIDATE_IMAGE}" \
            .

          DIGEST=$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/core-build-metadata.json")
          echo "source=${CANDIDATE_IMAGE%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"
      
      # ignore-error=true on the export keeps a failed cache push from failing
      # the image push, so a broken export is otherwise completely silent, and
      # the private cache repository means nobody notices by browsing it either.
      # A missing candidate leaves the live cache unchanged, so it only warns.
      - name: Check cache export
        id: check_cache
        if: ${{ steps.images.outputs.skip_core_build == 'false' && inputs.export_docker_cache }}
        env:
          EXPORT_REF: ${{ steps.core_cache.outputs.export_ref }}
        run: |
          if DIGEST=$(crane digest "${EXPORT_REF}" 2>/dev/null); then
            echo "Cache exported to candidate ${EXPORT_REF} (${DIGEST})"
            echo "source=${EXPORT_REF%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cache export to ${EXPORT_REF} wrote nothing: the candidate does not exist after the build, so the live cache stays as it was. Check the 'exporting cache to registry' line above."
          fi
      
      # Resolved separately because this step also runs when the core build was
      # skipped for a prebuilt core image, which is the path that used to have
      # no warm cache at all. It imports the same refs and exports none:
      # the deps stage it would add is not worth a second exporter. The core
      # cache candidate is imported too, because the live ref is only updated
      # after the secret scan.
      - name: Resolve untuned build cache
        id: untuned_cache
        if: ${{ inputs.build_untuned_image }}
        uses: ./.github/actions/resolve-build-cache
        with:
          cache_image_name: ${{ inputs.cache_image_name }}
          channel: 'core'
          ref: ${{ inputs.git_ref }}
          cache_scope: ${{ inputs.cache_scope }}
          extra_cache_from: ${{ steps.images.outputs.cache_source }} ${{ steps.core_cache.outputs.export_ref }}
          export: 'false'

      - name: Build untuned image
        id: build_untuned
        if: ${{ inputs.build_untuned_image }}
        env:
          BUILDKIT_PROGRESS: plain
          DOCKER_BUILD_ARGS: ${{ inputs.docker_build_args }}
          CACHE_FROM_FLAGS: ${{ steps.untuned_cache.outputs.cache_from_flags }}
          CANDIDATE_IMAGE: ${{ inputs.cache_image_name }}:${{ env.CANDIDATE_TAG }}-untuned-${{ inputs.image_tag }}
        run: |
          BUILD_ARGS=()
          while IFS= read -r build_arg; do
            [[ -z "${build_arg}" ]] && continue
            if [[ ! "${build_arg}" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]] || [[ "${build_arg}" == *$'\r'* ]]; then
              echo "::error::Invalid Docker build argument syntax"
              exit 1
            fi
            BUILD_ARGS+=(--build-arg "${build_arg}")
          done <<< "${DOCKER_BUILD_ARGS}"

          docker buildx build \
            --builder "${BUILDX_BUILDER:?BUILDX_BUILDER is required}" \
            -f docker/Dockerfile.ci \
            --push \
            ${CACHE_FROM_FLAGS} \
            "${BUILD_ARGS[@]}" \
            --metadata-file "${RUNNER_TEMP}/untuned-build-metadata.json" \
            -t "${CANDIDATE_IMAGE}" \
            .

          DIGEST=$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/untuned-build-metadata.json")
          echo "source=${CANDIDATE_IMAGE%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"
      
      - name: Set outputs
        id: set_outputs
        env:
          CORE_IMAGE: ${{ inputs.core_image_name }}:${{ inputs.image_tag }}
          STAGING_IMAGE: ${{ inputs.staging_image_name }}:${{ inputs.image_tag }}-temp
          CORE_SOURCE: ${{ steps.build_core.outputs.source }}
          UNTUNED_SOURCE: ${{ steps.build_untuned.outputs.source }}
          CACHE_SOURCE: ${{ steps.check_cache.outputs.source }}
          CACHE_LIVE_REF: ${{ steps.core_cache.outputs.live_ref }}
        run: |
          TARGETS=$(jq -cn \
            --arg core "${CORE_SOURCE}" --arg core_dest "${CORE_IMAGE}" \
            --arg untuned "${UNTUNED_SOURCE}" --arg untuned_dest "${STAGING_IMAGE}" \
            --arg cache "${CACHE_SOURCE}" --arg cache_dest "${CACHE_LIVE_REF}" \
            '[
              (select($core != "") | {name: "core image", source: $core, image_scan: true, promote: [$core_dest]}),
              (select($untuned != "") | {name: "untuned image", source: $untuned, image_scan: true, promote: [$untuned_dest]}),
              (select($cache != "") | {name: "core build cache", source: $cache, image_scan: false, promote: [$cache_dest]})
            ]')
          # Kept in a file: GitHub drops job outputs that contain the Docker
          # Hub organization, which is stored as a secret.
          mkdir -p "${RUNNER_TEMP}/secret-scan-targets"
          printf '%s\n' "${TARGETS}" > "${RUNNER_TEMP}/secret-scan-targets/targets.json"
          {
            echo "core_image_with_tag=${CORE_IMAGE}"
            echo "staging_image_with_tag=${STAGING_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Trivy scan and promote
        uses: ./.github/actions/secret-scan
        with:
          targets_file: ${{ runner.temp }}/secret-scan-targets/targets.json
          scan_id: core
      
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-workspace
        with:
          images: ''
          containers: ''
