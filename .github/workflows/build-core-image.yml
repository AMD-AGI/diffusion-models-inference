name: Build core image
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - 'integrations/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag. Short commit SHA will be used by default. Untuned image will receive an additional -temp suffix."
        required: false
        default: ""
      runner:
        description: "Runner label"
        required: false
        default: ""
      prebuilt_core_image_tag:
        description: "Prebuilt core image tag (build untuned only)"
        required: false
        default: ""
      disable_docker_cache:
        description: "Disable Docker cache on core build"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

jobs:
  get-short-sha:
    name: Compute short SHA
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      
      - name: Get short commit SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Write workflow summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Workflow Configuration'
          tables: |
            {
              "Core build parameters": {
                "tag": "${{ inputs.tag }}",
                "runner": "${{ inputs.runner || 'build-only' }}",
                "prebuilt_core_image_tag": "${{ inputs.prebuilt_core_image_tag || '' }}",
                "short_sha": "${{ steps.short_sha.outputs.sha }}"
              }
            }

  build-xdit-images:
    name: Build xDiT images
    needs: [get-short-sha]
    uses: ./.github/workflows/build-core-image-reusable.yml
    with:
      git_ref: ${{ github.ref_name }}
      image_tag: ${{ inputs.tag || needs.get-short-sha.outputs.short_sha }}
      core_image_name: ${{ vars.CORE_IMAGE || 'amdsiloai/pytorch-xdit-core' }}
      staging_image_name: ${{ vars.STAGING_IMAGE || 'amdsiloai/pytorch-xdit-staging' }}
      prebuilt_core_image_tag: ${{ inputs.prebuilt_core_image_tag }}
      build_untuned_image: true
      disable_docker_cache: ${{ inputs.disable_docker_cache || false }}
      runner: ${{ inputs.runner || vars.BUILD_RUNNER || 'build-only' }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}