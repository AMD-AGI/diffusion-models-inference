name: Build vLLM-Omni image
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - 'integrations/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag. Short commit SHA will be used by default."
        required: false
        default: ""
      runner:
        description: "Runner label"
        required: false
        default: ""
      disable_docker_cache:
        description: "Disable Docker cache on build"
        type: boolean
        required: false
        default: false
      export_docker_cache:
        description: "Export the build cache to the registry"
        type: boolean
        required: false
        default: true
      cache_scope:
        description: "Layer cache scope. Defaults to the branch name, so only builds of main touch the mainline cache."
        required: false
        default: ""
      docker_build_args:
        description: "Newline-separated Docker build arguments in KEY=VALUE form"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  get-short-sha:
    name: Compute short SHA
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get short commit SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Write workflow summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Workflow Configuration'
          tables: |
            {
              "vLLM-Omni build parameters": {
                "tag": "${{ inputs.tag || steps.short_sha.outputs.sha }}",
                "runner": "${{ inputs.runner || vars.BUILD_RUNNER || 'build-only' }}",
                "disable_docker_cache": "${{ inputs.disable_docker_cache || 'false' }}",
                "export_docker_cache": "${{ inputs.export_docker_cache || github.event_name == 'push' }}",
                "cache_scope": "${{ inputs.cache_scope || github.ref_name }}",
                "docker_build_args": ${{ toJSON(inputs.docker_build_args || '') }}
              }
            }

  build-vllm-omni-image:
    name: Build vLLM-Omni image
    needs: [get-short-sha]
    uses: ./.github/workflows/build-core-image-reusable.yml
    with:
      git_ref: ${{ github.ref_name }}
      image_tag: ${{ inputs.tag || needs.get-short-sha.outputs.short_sha }}
      core_image_name: ${{ vars.VLLM_OMNI_IMAGE || 'amdsiloai/pytorch-vllm-omni' }}
      dockerfile: docker/Dockerfile.vllm_omni
      build_target: ''
      cache_channel: vllm-omni
      cache_image_name: ${{ vars.BUILDCACHE_IMAGE || 'amdsiloai/pytorch-xdit-buildcache' }}
      cache_scope: ${{ inputs.cache_scope }}
      build_untuned_image: false
      disable_docker_cache: ${{ inputs.disable_docker_cache || false }}
      export_docker_cache: ${{ inputs.export_docker_cache || github.event_name == 'push' }}
      docker_build_args: ${{ inputs.docker_build_args }}
      runner: ${{ inputs.runner || vars.BUILD_RUNNER || 'build-only' }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}
