name: Build core image
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - 'integrations/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag. Short commit SHA will be used by default. Untuned image will receive an additional -temp suffix."
        required: false
        default: ""
      runner:
        description: "Runner label"
        required: false
        default: ""
      prebuilt_core_image_tag:
        description: "Prebuilt core image tag (build untuned only)"
        required: false
        default: ""
      force_trigger_tuning:
        description: "Force trigger automatic tuning"
        type: boolean
        required: false
        default: false
      disable_docker_cache:
        description: "Disable Docker cache on core build"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

jobs:
  get-short-sha:
    name: Compute short SHA
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      
      - name: Get short commit SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Write workflow summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Workflow Configuration'
          tables: |
            {
              "Core build parameters": {
                "tag": "${{ inputs.tag }}",
                "runner": "${{ inputs.runner || 'build-only' }}",
                "prebuilt_core_image_tag": "${{ inputs.prebuilt_core_image_tag || '' }}",
                "force_trigger_tuning": "${{ inputs.force_trigger_tuning || 'false' }}",
                "short_sha": "${{ steps.short_sha.outputs.sha }}"
              }
            }

  build-xdit-images:
    name: Build xDiT images
    needs: [get-short-sha]
    uses: ./.github/workflows/build-core-image-reusable.yml
    with:
      git_ref: ${{ github.ref_name }}
      image_tag: ${{ inputs.tag || needs.get-short-sha.outputs.short_sha }}
      core_image_name: ${{ vars.CORE_IMAGE || 'amdsiloai/pytorch-xdit-core' }}
      staging_image_name: ${{ vars.STAGING_IMAGE || 'amdsiloai/pytorch-xdit-staging' }}
      prebuilt_core_image_tag: ${{ inputs.prebuilt_core_image_tag }}
      build_untuned_image: true
      disable_docker_cache: ${{ inputs.disable_docker_cache || false }}
      runner: ${{ inputs.runner || vars.BUILD_RUNNER || 'build-only' }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}
  
  check-changes:
    name: Check for MIOpen changes
    needs: [build-xdit-images]
    runs-on: ubuntu-latest
    outputs:
      should_trigger: ${{ steps.check.outputs.should_trigger }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      
      - name: Check for MIOpen changes
        id: check
        uses: ./.github/actions/check-miopen-changes
        with:
          base_ref: HEAD~1
          head_ref: HEAD
  
  prepare:
    name: Prepare build configuration
    needs: [check-changes, get-short-sha]
    runs-on: ubuntu-latest
    if: |
      inputs.force_trigger_tuning == true ||
      (
        github.ref_name == 'main' &&
        needs.check-changes.outputs.should_trigger == 'true'
      )
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      mi300_runner: ${{ steps.tuning_config.outputs.mi300_runner }}
      mi325_runner: ${{ steps.tuning_config.outputs.mi325_runner }}
      mi355_runner: ${{ steps.tuning_config.outputs.mi355_runner }}
      tuning_enabled: ${{ steps.tuning_config.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      
      - name: Determine image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          SHORT_SHA: ${{ needs.get-short-sha.outputs.short_sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare tuning configuration
        id: tuning_config
        env:
          VAR_MI300_RUNNER: ${{ vars.DEFAULT_MI300_RUNNER }}
          VAR_MI325_RUNNER: ${{ vars.DEFAULT_MI325_RUNNER }}
          VAR_MI355_RUNNER: ${{ vars.DEFAULT_MI355_RUNNER }}
        run: |
          # Trim whitespace from repository variables
          MI300_RUNNER=$(echo "$VAR_MI300_RUNNER" | xargs)
          MI325_RUNNER=$(echo "$VAR_MI325_RUNNER" | xargs)
          MI355_RUNNER=$(echo "$VAR_MI355_RUNNER" | xargs)
          
          # Output values
          echo "mi300_runner=${MI300_RUNNER}" >> $GITHUB_OUTPUT
          echo "mi325_runner=${MI325_RUNNER}" >> $GITHUB_OUTPUT
          echo "mi355_runner=${MI355_RUNNER}" >> $GITHUB_OUTPUT
          
          # Check if tuning should be enabled
          ENABLED=false
          
          if [ -z "${MI300_RUNNER}" ] && [ -z "${MI325_RUNNER}" ] && [ -z "${MI355_RUNNER}" ]; then
            echo "Tuning disabled: no architecture runners configured"
          else
            ENABLED=true
            echo "Tuning enabled: at least one architecture runner configured"
          fi
          
          echo "enabled=${ENABLED}" >> $GITHUB_OUTPUT
  
  trigger-tuning:
    name: Trigger MIOpen tuning workflow
    needs: [check-changes, prepare, build-xdit-images]
    runs-on: ubuntu-latest
    if: |
      (
        inputs.force_trigger_tuning == true ||
        (
          github.ref_name == 'main' &&
          needs.check-changes.outputs.should_trigger == 'true'
        )
      ) &&
      needs.prepare.outputs.tuning_enabled == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      
      - name: Write workflow summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'MIOpen tuning parameters'
          tables: |
            {
              "Workflow parameters": {
                "git_branch": "${{ github.ref_name }}",
                "prebuilt_untuned_image_tag": "${{ needs.prepare.outputs.image_tag }}-temp",
                "run_mode": "${{ vars.BENCHMARK_AFTER_AUTOMATIC_TUNING == 'true' && 'MIOpen tuning + benchmarking' || 'MIOpen tuning only' }}"
              },
              "MIOpen modes": {
                "miopen_find_mode": "${{ vars.DEFAULT_MIOPEN_FIND_MODE }}",
                "miopen_find_enforce": "${{ vars.DEFAULT_MIOPEN_FIND_ENFORCE }}"
              },
              "Tuning configuration": {
                "mi300_enabled": "${{ needs.prepare.outputs.mi300_runner != '' }}",
                "mi325_enabled": "${{ needs.prepare.outputs.mi325_runner != '' }}",
                "mi355_enabled": "${{ needs.prepare.outputs.mi355_runner != '' }}"
              }
            }
      
      - name: Trigger build-and-benchmark workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BENCHMARK_AFTER_TUNING_VAR: ${{ vars.BENCHMARK_AFTER_AUTOMATIC_TUNING }}
          MIOPEN_FIND_MODE_VAR: ${{ vars.DEFAULT_MIOPEN_FIND_MODE }}
          MIOPEN_FIND_ENFORCE_VAR: ${{ vars.DEFAULT_MIOPEN_FIND_ENFORCE }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          MI300_RUNNER: ${{ needs.prepare.outputs.mi300_runner }}
          MI325_RUNNER: ${{ needs.prepare.outputs.mi325_runner }}
          MI355_RUNNER: ${{ needs.prepare.outputs.mi355_runner }}
        run: |
          BENCHMARK_AFTER_TUNING=$(echo "$BENCHMARK_AFTER_TUNING_VAR" | xargs)
          if [ "${BENCHMARK_AFTER_TUNING}" = "true" ]; then
            RUN_MODE="MIOpen tuning + benchmarking"
          else
            RUN_MODE="MIOpen tuning only"
          fi
          
          # Get MIOpen parameters from repository variables
          MIOPEN_FIND_MODE=$(echo "$MIOPEN_FIND_MODE_VAR" | xargs)
          MIOPEN_FIND_ENFORCE=$(echo "$MIOPEN_FIND_ENFORCE_VAR" | xargs)
          
          gh workflow run "build-and-benchmark.yml" \
            --repo "$REPOSITORY" \
            --ref "$REF_NAME" \
            --field git_branch="$REF_NAME" \
            --field prebuilt_untuned_image_tag="${IMAGE_TAG}-temp" \
            --field run_mode="${RUN_MODE}" \
            --field miopen_find_mode="${MIOPEN_FIND_MODE}" \
            --field miopen_find_enforce="${MIOPEN_FIND_ENFORCE}" \
            --field mi300_runner="$MI300_RUNNER" \
            --field mi325_runner="$MI325_RUNNER" \
            --field mi355_runner="$MI355_RUNNER"