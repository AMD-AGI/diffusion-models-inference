name: Build NV Image (Reusable)

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      image_tag:
        description: 'Base image tag to use for the built image'
        required: true
        type: string
      image_tag_suffix:
        description: 'Optional suffix appended to image_tag (e.g. -amd64, -arm64)'
        required: false
        type: string
        default: ''
      image_name:
        description: 'NV image name'
        required: false
        type: string
        default: 'amdsiloai/pytorch-xdit-nvidia'
      platform:
        description: 'Target platform. Must be one of: linux/amd64, linux/arm64. Validated at runtime; the workflow_call schema does not support a choice type.'
        required: true
        type: string
      runner:
        description: 'Runner label to use'
        required: false
        type: string
        default: ''
      disable_docker_cache:
        description: 'Disable Docker cache on build (equivalent to --no-cache)'
        required: false
        type: boolean
        default: false
    outputs:
      image_with_tag:
        description: 'Full NV image with tag (includes any suffix)'
        value: ${{ jobs.build.outputs.image_with_tag }}
    secrets:
      DOCKERHUB_ORGANIZATION:
        description: 'Docker Hub username/organization'
        required: true
      DOCKERHUB_OAT:
        description: 'Docker Hub access token'
        required: true

jobs:
  build:
    name: Build image
    runs-on: ${{ inputs.runner || 'build-only' }}
    timeout-minutes: 1440
    outputs:
      image_with_tag: ${{ steps.set_outputs.outputs.image_with_tag }}
    steps:
      - name: Validate platform input
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *)
              echo "::error::Invalid platform '$PLATFORM'. Must be linux/amd64 or linux/arm64."
              exit 1
              ;;
          esac
      
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build NV image
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          BUILDKIT_PROGRESS: plain
          PLATFORM: ${{ inputs.platform }}
          DISABLE_CACHE: ${{ inputs.disable_docker_cache }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_name }}:${{ inputs.image_tag }}${{ inputs.image_tag_suffix }}
          TAG_SUFFIX: ${{ inputs.image_tag_suffix }}
          FLASH_ATTN_MAX_JOBS_AARCH64: '1'
        run: |
          NO_CACHE_FLAG=""
          if [ "${DISABLE_CACHE}" = "true" ]; then
            NO_CACHE_FLAG="--no-cache"
          fi
          
          EXTRA_BUILD_ARGS=""
          if [ "${PLATFORM}" = "linux/arm64" ]; then
            EXTRA_BUILD_ARGS="--build-arg FLASH_ATTN_MAX_JOBS_AARCH64=${FLASH_ATTN_MAX_JOBS_AARCH64}"
          fi
          
          # IMAGE_TAG carries the commit SHA, so it never exists before a build
          # of a new commit and can only seed cache when the same tag is rebuilt.
          # This per-platform ref is stable across commits and is what lets a
          # build reuse the previous commit's layers, on any runner.
          CACHE_REF="${IMAGE_NAME}:buildcache${TAG_SUFFIX}"
          
          # The remote builder imports cache straight from the registry, so a
          # missing ref must not fail the build.
          CACHE_FROM_FLAGS=""
          if [ "${DISABLE_CACHE}" != "true" ]; then
            for REF in "${CACHE_REF}" "${IMAGE_TAG}"; do
              if docker buildx imagetools inspect --raw "${REF}" >/dev/null 2>&1; then
                CACHE_FROM_FLAGS="${CACHE_FROM_FLAGS} --cache-from type=registry,ref=${REF}"
              else
                echo "No cache to import from ${REF}"
              fi
            done
          fi

          # Exported even when the cache is disabled, so that a --no-cache run
          # repopulates the cache instead of leaving it stale. Cache blobs are
          # the image's own layers pushed to the same repository, so the
          # registry deduplicates them; do not re-compress them here or the
          # digests change and dedup is lost.
          docker buildx build \
            --builder "${BUILDX_BUILDER:?BUILDX_BUILDER is required}" \
            -f docker/Dockerfile.cuda \
            --platform "${PLATFORM}" \
            --pull \
            --push \
            ${NO_CACHE_FLAG} \
            ${EXTRA_BUILD_ARGS} \
            ${CACHE_FROM_FLAGS} \
            --cache-to "type=registry,ref=${CACHE_REF},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            -t "${IMAGE_TAG}" \
            .
      
      - name: Set outputs
        id: set_outputs
        run: |
          echo "image_with_tag=${{ inputs.image_name }}:${{ inputs.image_tag }}${{ inputs.image_tag_suffix }}" >> $GITHUB_OUTPUT
      
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-workspace
        with:
          images: ''
          containers: ''
