name: Build NV Image (Reusable)

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      image_tag:
        description: 'Base image tag to use for the built image'
        required: true
        type: string
      image_tag_suffix:
        description: 'Optional suffix appended to image_tag (e.g. -amd64, -arm64)'
        required: false
        type: string
        default: ''
      image_name:
        description: 'NV image name'
        required: false
        type: string
        default: 'amdsiloai/pytorch-xdit-nvidia'
      platform:
        description: 'Target platform. Must be one of: linux/amd64, linux/arm64. Validated at runtime; the workflow_call schema does not support a choice type.'
        required: true
        type: string
      runner:
        description: 'Runner label to use'
        required: false
        type: string
        default: ''
      disable_docker_cache:
        description: 'Disable Docker cache on build (equivalent to --no-cache)'
        required: false
        type: boolean
        default: false
    outputs:
      image_with_tag:
        description: 'Full NV image with tag (includes any suffix)'
        value: ${{ jobs.build.outputs.image_with_tag }}
    secrets:
      DOCKERHUB_ORGANIZATION:
        description: 'Docker Hub username/organization'
        required: true
      DOCKERHUB_OAT:
        description: 'Docker Hub access token'
        required: true

jobs:
  build:
    name: Build image
    runs-on: ${{ inputs.runner || 'build-only' }}
    timeout-minutes: 1440
    env:
      BUILDX_BUILDER_NAME: xdit-nv-image-builder
    outputs:
      image_with_tag: ${{ steps.set_outputs.outputs.image_with_tag }}
    steps:
      - name: Validate platform input
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *)
              echo "::error::Invalid platform '$PLATFORM'. Must be linux/amd64 or linux/arm64."
              exit 1
              ;;
          esac
      
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}
      
      # The docker/Dockerfile.cuda flash-attention RUN step caps MAX_JOBS at
      # FLASH_ATTN_MAX_JOBS_AARCH64 (default 32) on aarch64 to protect
      # memory-constrained native aarch64 hosts like GB300 / Grace-Blackwell
      # from OOM. Under QEMU on a build-only x86 runner the host has plenty
      # of RAM but the emulation is slow, so we raise the cap to the build
      # host's full core count to recover parallelism. This step records the
      # host's nproc; the value is injected as a --build-arg only for the
      # arm64 (QEMU) build below.
      - name: Detect build host parallelism
        if: ${{ inputs.platform == 'linux/arm64' }}
        id: cores
        shell: bash
        run: |
          NPROC=$(nproc)
          echo "Detected ${NPROC} cores on build host"
          echo "nproc=${NPROC}" >> $GITHUB_OUTPUT
      
      - name: Set up QEMU
        if: ${{ inputs.platform == 'linux/arm64' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx with custom log size
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER_NAME }}
          driver: docker-container
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=104857600
          use: true
          cleanup: false
      
      - name: Build NV image
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          builder: ${{ env.BUILDX_BUILDER_NAME }}
          file: docker/Dockerfile.cuda
          context: .
          platforms: ${{ inputs.platform }}
          push: true
          pull: true
          no-cache: ${{ inputs.disable_docker_cache }}
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}${{ inputs.image_tag_suffix }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            ${{ inputs.platform == 'linux/arm64' && format('FLASH_ATTN_MAX_JOBS_AARCH64={0}', steps.cores.outputs.nproc) || '' }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache-${{ inputs.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            type=registry,ref=${{ inputs.image_name }}:${{ inputs.image_tag }}${{ inputs.image_tag_suffix }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ inputs.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=min
      
      - name: Set outputs
        id: set_outputs
        run: |
          echo "image_with_tag=${{ inputs.image_name }}:${{ inputs.image_tag }}${{ inputs.image_tag_suffix }}" >> $GITHUB_OUTPUT
      
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-workspace
        with:
          images: ''
          containers: ''
