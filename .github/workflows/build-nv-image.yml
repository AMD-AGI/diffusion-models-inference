name: Build NV image
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - 'integrations/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag. Short commit SHA will be used by default."
        required: false
        default: ""
      runner:
        description: "Runner label"
        required: false
        default: ""
      disable_docker_cache:
        description: "Disable Docker cache on NV build"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

jobs:
  get-short-sha:
    name: Compute short SHA
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      
      - name: Get short commit SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Write workflow summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Workflow Configuration'
          tables: |
            {
              "NV build parameters": {
                "tag": "${{ inputs.tag }}",
                "runner": "${{ inputs.runner || 'build-only' }}",
                "disable_docker_cache": "${{ inputs.disable_docker_cache || 'false' }}",
                "short_sha": "${{ steps.short_sha.outputs.sha }}"
              }
            }

  build-nv-image:
    name: Build NV image (${{ matrix.platform }})
    needs: [get-short-sha]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: -amd64
          - platform: linux/arm64
            tag_suffix: -arm64
    uses: ./.github/workflows/build-nv-image-reusable.yml
    with:
      git_ref: ${{ github.head_ref || github.ref_name }}
      image_tag: ${{ inputs.tag || needs.get-short-sha.outputs.short_sha }}
      image_tag_suffix: ${{ matrix.tag_suffix }}
      image_name: ${{ vars.NV_IMAGE || 'amdsiloai/pytorch-xdit-nvidia' }}
      platform: ${{ matrix.platform }}
      disable_docker_cache: ${{ inputs.disable_docker_cache || false }}
      runner: ${{ inputs.runner || vars.BUILD_RUNNER_NV || 'build-only' }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}

  assemble-manifest:
    name: Assemble multi-arch manifest
    needs: [get-short-sha, build-nv-image]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ vars.NV_IMAGE || 'amdsiloai/pytorch-xdit-nvidia' }}
          TAG: ${{ inputs.tag || needs.get-short-sha.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
