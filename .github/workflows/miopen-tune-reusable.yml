name: MIOpen Tuning (Reusable)

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      image:
        description: 'Image to tune with'
        required: true
        type: string
      arch:
        description: 'GPU tag (e.g. gfx942, gfx950)'
        required: true
        type: string
      runner:
        description: 'Runner label to execute on'
        required: true
        type: string
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 1440
      miopen_find_mode:
        description: 'MIOpen find mode (integer)'
        required: false
        type: string
        default: '1'
      miopen_find_enforce:
        description: 'MIOpen find enforce (integer)'
        required: false
        type: string
        default: '3'
      force_retuning:
        description: 'Force full retuning (delete existing tuning databases before tuning)'
        required: false
        type: boolean
        default: false
      artifact_name:
        description: 'Artifact name for the tuned MIOpen databases'
        required: true
        type: string
    secrets:
      DOCKERHUB_ORGANIZATION:
        description: 'Docker Hub username/organization'
        required: true
      DOCKERHUB_OAT:
        description: 'Docker Hub access token'
        required: true

permissions:
  contents: read

jobs:
  tune:
    name: MIOpen tuning
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}

      - name: Pull image
        env:
          DOCKER_IMAGE: ${{ inputs.image }}
        run: docker pull "$DOCKER_IMAGE"

      - name: Run MIOpen tuning
        uses: ./.github/actions/run-miopen-tuning
        with:
          image: ${{ inputs.image }}
          arch: ${{ inputs.arch }}
          artifact_name: ${{ inputs.artifact_name }}
          miopen_find_mode: ${{ inputs.miopen_find_mode }}
          miopen_find_enforce: ${{ inputs.miopen_find_enforce }}
          force_retuning: ${{ inputs.force_retuning }}

      - name: Image cleanup
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cleanup-workspace
        with:
          images: ${{ inputs.image }}
          containers: 'miopen-tune'
          skip_workspace_cleanup: 'true'

      - name: Workspace cleanup
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cleanup-workspace
        with:
          containers: 'miopen-tune'
          skip_workspace_cleanup: 'false'
