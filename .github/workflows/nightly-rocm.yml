name: Nightly ROCm Build and Benchmark
run-name: "Nightly ROCm ${{ github.event_name == 'schedule' && github.event.schedule || 'manual' }}"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-rocm-build-and-benchmark
  cancel-in-progress: false

jobs:
  resolve-rocm:
    name: Resolve latest ROCm nightly
    runs-on: ubuntu-latest
    outputs:
      rocm_wheel_version: ${{ steps.resolve.outputs.rocm_wheel_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve latest ROCm nightly
        id: resolve
        uses: ./.github/actions/resolve-rocm-nightly
        with:
          provenance_file: ${{ runner.temp }}/rocm-nightly/provenance.json

      - name: Upload ROCm nightly provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-nightly-provenance
          path: ${{ runner.temp }}/rocm-nightly/provenance.json
          if-no-files-found: error

      - name: Write workflow summary
        uses: ./.github/actions/write-workflow-summary
        with:
          title: 'Resolved ROCm Nightly'
          tables: |
            {
              "ROCm wheels": {
                "rocm_wheel_version": "${{ steps.resolve.outputs.rocm_wheel_version }}",
                "newest_rocm_wheel_version": "${{ steps.resolve.outputs.newest_rocm_wheel_version }}",
                "pins_available_in_newest": "${{ steps.resolve.outputs.pins_available_in_newest }}",
                "image_tag": "nightly-${{ steps.resolve.outputs.rocm_wheel_version }}"
              }
            }

  build-and-benchmark:
    name: Build and benchmark latest ROCm nightly
    needs: [resolve-rocm]
    uses: ./.github/workflows/build-and-benchmark.yml
    with:
      git_branch: ${{ github.ref_name }}
      image_tag: nightly-${{ needs.resolve-rocm.outputs.rocm_wheel_version }}
      rebuild: true
      run_miopen_tuning: true
      run_benchmarks: true
      build_final: true
      create_miopen_db_branch: false
      disable_docker_cache: true
      export_docker_cache: false
      cache_scope: 'nightly-rocm'
      benchmark_flags: "--tag nightly"
      docker_build_args: |
        ROCM_WHEEL_VERSION=${{ needs.resolve-rocm.outputs.rocm_wheel_version }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
