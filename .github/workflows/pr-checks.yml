# SPDX-License-Identifier: MIT

name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changed-files:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      python_files: ${{ steps.filter.outputs.python_files }}
      yaml: ${{ steps.filter.outputs.yaml }}
      yaml_files: ${{ steps.filter.outputs.yaml_files }}
      spdx: ${{ steps.filter.outputs.spdx }}
      spdx_files: ${{ steps.filter.outputs.spdx_files }}
      shell: ${{ steps.filter.outputs.shell }}
      shell_files: ${{ steps.filter.outputs.shell_files }}
      workflows: ${{ steps.filter.outputs.workflows }}
      workflow_files: ${{ steps.filter.outputs.workflow_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed files
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          all_changed=$(git diff --name-only --diff-filter=ACMR "$base" "$head")

          py_files=$(echo "$all_changed" | grep '\.py$' || true)
          yml_files=$(echo "$all_changed" | grep '\.ya\?ml$' | grep -v '^data/hipblaslt/' || true)
          spdx_files=$(echo "$all_changed" | grep -E '^data/hipblaslt/.*\.yaml$|^data/miopen/resolve_prefix\.sh$' || true)

          {
            echo "python=$( [ -n "$py_files" ] && echo true || echo false )"
            echo "yaml=$( [ -n "$yml_files" ] && echo true || echo false )"
            echo "spdx=$( [ -n "$spdx_files" ] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

          sh_files=$(echo "$all_changed" | grep '\.sh$' || true)
          wf_files=$(echo "$all_changed" | grep -E '^\.github/workflows/.*\.ya?ml$' || true)

          {
            echo "shell=$( [ -n "$sh_files" ] && echo true || echo false )"
            echo "workflows=$( [ -n "$wf_files" ] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

          {
            echo "python_files<<EOF"
            echo "$py_files"
            echo "EOF"
            echo "yaml_files<<EOF"
            echo "$yml_files"
            echo "EOF"
            echo "spdx_files<<EOF"
            echo "$spdx_files"
            echo "EOF"
            echo "shell_files<<EOF"
            echo "$sh_files"
            echo "EOF"
            echo "workflow_files<<EOF"
            echo "$wf_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  lint-python:
    name: Lint Python
    needs: changed-files
    if: needs.changed-files.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: ruff check
        run: echo '${{ needs.changed-files.outputs.python_files }}' | xargs ruff check --output-format=github

  lint-yaml:
    name: Lint YAML
    needs: changed-files
    if: needs.changed-files.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - name: yamllint
        run: echo '${{ needs.changed-files.outputs.yaml_files }}' | xargs yamllint -s

  check-spdx-headers:
    name: Check SPDX headers
    needs: changed-files
    if: needs.changed-files.outputs.spdx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers on changed files
        run: |
          status=0
          check_header() {
            local file="$1"
            if ! head -n 3 "$file" | grep -qF '# Copyright Advanced Micro Devices, Inc.' ||
               ! head -n 3 "$file" | grep -qF '# SPDX-License-Identifier: MIT'; then
              printf 'Missing or incorrect SPDX header: %s\n' "$file" >&2
              status=1
            fi
          }
          while IFS= read -r file; do
            [ -n "$file" ] && check_header "$file"
          done <<< '${{ needs.changed-files.outputs.spdx_files }}'
          exit "$status"

  shellcheck:
    name: ShellCheck
    needs: changed-files
    if: needs.changed-files.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: echo '${{ needs.changed-files.outputs.shell_files }}' | xargs shellcheck

  actionlint:
    name: Action lint
    needs: changed-files
    if: needs.changed-files.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --exclude=SC2086
        run: echo '${{ needs.changed-files.outputs.workflow_files }}' | xargs ./actionlint
