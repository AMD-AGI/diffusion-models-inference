# Benchmarks an already-built image on an external cluster. Informational only —
# results do not feed tuning or optimisation work in this repository.
name: Remote Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_image:
        description: 'Image tag (short git SHA) or full staging image path to benchmark'
        required: true
      gpu_arch:
        description: 'Architecture to target on the remote cluster (e.g. mi350p, gfx1201)'
        required: true
        default: 'mi350p'
      gpu:
        description: 'GPUs to request, and the parallelism every benchmark runs at. All 8 are rarely free during working hours; lower this if the workload stays queued.'
        required: true
        type: choice
        default: '8'
        options: ['1', '2', '4', '8']
      cpu:
        description: 'CPU cores to request'
        required: false
        type: choice
        default: '16'
        options: ['16', '32', '64', '128']
      memory:
        description: 'Memory to request'
        required: false
        type: choice
        default: '64Gi'
        options: ['64Gi', '128Gi', '256Gi', '512Gi', '1024Gi']
      benchmark_flags:
        description: 'Flags used to filter benchmarks, leave empty to run all. Only --tag and --name are accepted. Examples: --tag release; or --name CONFIG_NAME to run a specific named config.'
        required: false
        default: ''
      runner_label:
        description: 'Label of the runner hosting the remote executor'
        required: false
        default: 'kube-bridge'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve architecture
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.parse.outputs.arch }}
    steps:
      - name: Normalise architecture name
        id: parse
        env:
          GPU_ARCH: ${{ inputs.gpu_arch }}
        run: |
          arch=$(echo "$GPU_ARCH" | tr '[:upper:]' '[:lower:]' | xargs)
          # Stricter than the executor's own architecture names, because this
          # also becomes the runner label the waiting job below targets.
          if ! [[ "$arch" =~ ^[a-z0-9][a-z0-9-]{0,30}$ ]]; then
            echo "::error::gpu_arch is not a valid architecture name: ${GPU_ARCH}"
            exit 1
          fi
          echo "arch=${arch}" >> "$GITHUB_OUTPUT"
          echo "Targeting: ${arch}"

  benchmark:
    name: '${{ needs.resolve.outputs.arch }} dispatch'
    needs: resolve
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 1500
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: resolve
        env:
          INPUT_IMAGE: ${{ inputs.benchmark_image }}
        run: |
          IMAGE=$(echo "$INPUT_IMAGE" | xargs)
          if [[ "$IMAGE" == *":"* ]]; then
            TAG="${IMAGE##*:}"
          else
            TAG="$IMAGE"
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Image tag is not a valid Docker tag: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run remote benchmark
        uses: ./.github/actions/run-remote-benchmark
        with:
          image_tag: ${{ steps.resolve.outputs.tag }}
          gpu_arch: ${{ needs.resolve.outputs.arch }}
          benchmark_flags: ${{ inputs.benchmark_flags }}
          cpu: ${{ inputs.cpu }}
          memory: ${{ inputs.memory }}
          gpu: ${{ inputs.gpu }}

  run-benchmark:
    name: '${{ needs.resolve.outputs.arch }} benchmark'
    needs: resolve
    permissions: {}
    runs-on: bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.resolve.outputs.arch }}
    timeout-minutes: 1440
    steps:
      - name: Resolve benchmark tag
        id: tag
        env:
          ARCH: ${{ needs.resolve.outputs.arch }}
          FLAGS: ${{ inputs.benchmark_flags }}
        run: |
          # Mirrors benchmark_tag in the executor's gpu-configs.yml, which stays
          # the source of truth; MI350P reports as gfx950.
          case "$ARCH" in
            mi350p) TAG=gfx950 ;;
            *)      TAG="$ARCH" ;;
          esac
          if [ -n "$FLAGS" ]; then
            echo "flags=${FLAGS}" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--tag ${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        env:
          FLAGS: ${{ steps.tag.outputs.flags }}
          GPUS: ${{ inputs.gpu }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/results"
          # The configs are baked into the image and pin 8-way parallelism, so
          # match them to the GPUs this pod was given.
          python3 /app/.ci/run.py ${FLAGS} \
            --override-args-json "{\"ulysses_degree\": ${GPUS}}" \
            --results-directory "${RUNNER_TEMP}/results" \
            --csv-output-path "${RUNNER_TEMP}/results/results.csv" \
            /app/.ci/benchmark_configs/*.yaml 2>&1 | tee "${RUNNER_TEMP}/results/benchmark.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.run_number }}-remote-benchmarks-${{ needs.resolve.outputs.arch }}
          path: ${{ runner.temp }}/results/**
          if-no-files-found: warn
