# Runs the build, MIOpen tuning, benchmarks, and accelerator tests for xDiT.
name: xDiT Hardware Compat
run-name: "${{ inputs.xdit_run_id && format('xDiT compat {0} [xdit-run:{1}]', inputs.xdit_sha, inputs.xdit_run_id) || format('xDiT compat {0} [standalone:{1}]', inputs.xdit_sha, github.run_id) }}"

on:
  workflow_dispatch:
    inputs:
      xdit_sha:
        description: 'Full xDiT commit SHA under test'
        required: true
      run_benchmarks:
        description: 'Run MIOpen tuning, benchmarks, and the final image build'
        type: boolean
        required: false
        default: true
      run_tests:
        description: 'Run accelerator tests'
        type: boolean
        required: false
        default: true
      xdit_run_id:
        description: 'Original xDiT run ID (leave empty for standalone runs)'
        required: false
        default: ''
      request_metadata:
        description: 'Optional JSON: benchmarks, architectures, amd_ref, use_xdit_configs; standalone defaults to nightly, gfx942/gfx950, selected branch, downstream configs'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    name: Prepare xDiT image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      benchmark_flags: ${{ steps.benchmarks.outputs.benchmark_flags }}
      architectures: ${{ steps.architectures.outputs.architectures }}
      architecture_matrix: ${{ steps.architectures.outputs.matrix }}
      amd_ref: ${{ steps.request.outputs.amd_ref }}
      use_xdit_configs: ${{ steps.request.outputs.use_xdit_configs }}
    steps:
      - name: Validate request metadata
        id: request
        env:
          REQUEST_METADATA: ${{ inputs.request_metadata }}
          XDIT_RUN_ID: ${{ inputs.xdit_run_id }}
          RUN_BENCHMARKS: ${{ inputs.run_benchmarks }}
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          set -euo pipefail
          if [[ "$RUN_BENCHMARKS" != true && "$RUN_TESTS" != true ]]; then
            echo "::error::Nothing to do: enable run_benchmarks, run_tests, or both."
            exit 1
          fi
          if [[ -z "$REQUEST_METADATA" && -z "$XDIT_RUN_ID" ]]; then
            REQUEST_METADATA=$(jq -cn --arg ref "$GITHUB_REF_NAME" \
              '{benchmarks: "--tag nightly", architectures: "gfx942,gfx950", amd_ref: $ref, use_xdit_configs: false}')
          fi
          if ! printf '%s' "$REQUEST_METADATA" | jq -se '
            length == 1 and (.[0] | type == "object" and
              ([.benchmarks, .architectures, .amd_ref] | all(.[];
                type == "string" and length > 0 and
                (test("[\u0000-\u001f\u007f]") | not))) and
              (if has("use_xdit_configs") then .use_xdit_configs | type == "boolean" else true end))
          ' >/dev/null; then
            echo "::error::Request metadata must be one JSON object with non-empty, single-line string fields: benchmarks, architectures, amd_ref; optional use_xdit_configs must be a boolean."
            exit 1
          fi
          amd_ref=$(printf '%s' "$REQUEST_METADATA" | jq -r '.amd_ref')
          if [[ ! "$amd_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] ||
             ! git check-ref-format "refs/heads/${amd_ref}" >/dev/null 2>&1; then
            echo "::error::Invalid AMD ref: '${amd_ref}'"
            exit 1
          fi
          printf '%s' "$REQUEST_METADATA" | jq -r '
            "benchmarks=\(.benchmarks)",
            "architectures=\(.architectures)",
            "amd_ref=\(.amd_ref)",
            "use_xdit_configs=\(.use_xdit_configs // false)"
          ' >> "$GITHUB_OUTPUT"
          printf 'metadata=%s\n' "$(printf '%s' "$REQUEST_METADATA" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Checkout AMD-AGI ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.amd_ref }}

      - name: Create image tag
        id: tag
        env:
          XDIT_SHA: ${{ inputs.xdit_sha }}
          XDIT_RUN_ID: ${{ inputs.xdit_run_id }}
          STAGING_IMAGE: ${{ vars.STAGING_IMAGE || 'amdsiloai/pytorch-xdit-staging' }}
        run: |
          if [[ ! "$XDIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid xDiT SHA: '${XDIT_SHA}'"
            exit 1
          fi
          if [[ -n "$XDIT_RUN_ID" ]]; then
            if [[ ! "$XDIT_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid xDiT run ID: '${XDIT_RUN_ID}'"
              exit 1
            fi
            run_suffix="$XDIT_RUN_ID"
          else
            run_suffix="standalone-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          MAIN_SHA=$(git rev-parse --short=7 HEAD)
          image_tag="${MAIN_SHA}-${XDIT_SHA:0:7}-${run_suffix}"
          {
            echo "image_tag=${image_tag}"
            echo "image=${STAGING_IMAGE}:${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate architectures
        id: architectures
        env:
          REQUESTED_ARCHITECTURES: ${{ steps.request.outputs.architectures }}
        run: |
          set -euo pipefail
          architectures=()
          IFS=',' read -r -a requested <<< "$REQUESTED_ARCHITECTURES"
          for architecture in "${requested[@]}"; do
            architecture=${architecture#"${architecture%%[![:space:]]*}"}
            architecture=${architecture%"${architecture##*[![:space:]]}"}
            if [[ ! "$architecture" =~ ^(gfx942|gfx950)$ ]]; then
              echo "::error::Invalid architecture: '${architecture}'"
              exit 1
            fi
            architectures+=("$architecture")
          done
          if [ "${#architectures[@]}" -eq 0 ]; then
            echo "::error::At least one architecture is required"
            exit 1
          fi
          sanitized_architectures=$(IFS=,; echo "${architectures[*]}")
          echo "architectures=${sanitized_architectures}" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -cn --arg architectures "$sanitized_architectures" '$architectures | split(",")')" >> "$GITHUB_OUTPUT"

      - name: Validate benchmark selection
        id: benchmarks
        env:
          REQUESTED_BENCHMARKS: ${{ steps.request.outputs.benchmarks }}
          REQUESTED_ARCHITECTURES: ${{ steps.architectures.outputs.architectures }}
          USE_XDIT_CONFIGS: ${{ steps.request.outputs.use_xdit_configs }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/benchmark-selection.sh"
          # An empty result is valid: it selects every config for the
          # architecture under test, which the runner filters on by itself.
          benchmark_flags=$(normalize_benchmark_selection \
            "$REQUESTED_BENCHMARKS" "$REQUESTED_ARCHITECTURES" "$USE_XDIT_CONFIGS")
          echo "benchmark_flags=${benchmark_flags}" >> "$GITHUB_OUTPUT"

      - name: Summarize xDiT request
        env:
          XDIT_RUN_ID: ${{ inputs.xdit_run_id }}
          XDIT_SHA: ${{ inputs.xdit_sha }}
          BENCHMARK_FLAGS: ${{ steps.benchmarks.outputs.benchmark_flags }}
          IMAGE: ${{ steps.tag.outputs.image }}
          REQUEST_METADATA: ${{ steps.request.outputs.metadata }}
          USE_XDIT_CONFIGS: ${{ steps.request.outputs.use_xdit_configs }}
          RUN_BENCHMARKS: ${{ inputs.run_benchmarks }}
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          metadata=$(printf '%s' "$REQUEST_METADATA" | jq .)
          {
            echo "## xDiT hardware request"
            echo
            if [[ -n "$XDIT_RUN_ID" ]]; then
              echo "[Original xDiT run](${GITHUB_SERVER_URL}/xdit-project/xDiT/actions/runs/${XDIT_RUN_ID})"
              echo
              echo "### Received request metadata"
              echo
              echo "Original request.json:"
            else
              echo "### Standalone request metadata"
            fi
            echo '<pre>'
            printf '%s\n' "$metadata" | jq -Rr '@html'
            echo '</pre>'
            echo
            echo "### Execution"
            echo '<pre>'
            printf 'xDiT commit: %s\nImage: %s\nBenchmark flags: %s\nUse xDiT configs: %s\nRun benchmarks: %s\nRun accelerator tests: %s\n' \
              "$XDIT_SHA" "$IMAGE" "${BENCHMARK_FLAGS:-(architecture filter only)}" "$USE_XDIT_CONFIGS" "$RUN_BENCHMARKS" "$RUN_TESTS" \
              | jq -Rr '@html'
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"

  # Build once so the test job can still use the image if benchmarking fails.
  build:
    needs: [prepare]
    uses: ./.github/workflows/build-core-image-reusable.yml
    with:
      git_ref: ${{ needs.prepare.outputs.amd_ref }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      core_image_name: ${{ vars.CORE_IMAGE || 'amdsiloai/pytorch-xdit-core' }}
      staging_image_name: ${{ vars.STAGING_IMAGE || 'amdsiloai/pytorch-xdit-staging' }}
      cache_image_name: ${{ vars.BUILDCACHE_IMAGE || 'amdsiloai/pytorch-xdit-buildcache' }}
      cache_scope: 'xdit-external'
      build_untuned_image: true
      runner: 'build-only'
      docker_build_args: |
        XDIT_COMMIT=${{ inputs.xdit_sha }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}

  compat:
    needs: [prepare, build]
    if: ${{ inputs.run_benchmarks }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build-and-benchmark.yml
    with:
      git_branch: ${{ needs.prepare.outputs.amd_ref }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      base_image: ${{ vars.STAGING_IMAGE || 'amdsiloai/pytorch-xdit-staging' }}:${{ needs.prepare.outputs.image_tag }}-temp
      rebuild: false
      run_miopen_tuning: true
      run_benchmarks: true
      build_final: true
      create_miopen_db_branch: false
      benchmark_flags: ${{ needs.prepare.outputs.benchmark_flags }}
      use_xdit_configs: ${{ fromJSON(needs.prepare.outputs.use_xdit_configs) }}
      cache_scope: 'xdit-external'
      docker_build_args: |
        XDIT_COMMIT=${{ inputs.xdit_sha }}
      gpu_runners: ${{ needs.prepare.outputs.architectures }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}
      HF_TOKEN: ${{ secrets.XDIT_HF_TOKEN }}

  hardware-tests:
    name: ${{ matrix.arch }} xDiT hardware tests
    needs: [prepare, build, compat]
    if: ${{ inputs.run_tests && !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ${{ matrix.arch }}
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.architecture_matrix) }}
    env:
      IMAGE: ${{ vars.STAGING_IMAGE || 'amdsiloai/pytorch-xdit-staging' }}:${{ needs.prepare.outputs.image_tag }}-temp
    steps:
      - name: Checkout workflow actions
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_OAT }}

      - name: Pull test image
        id: pull
        run: docker pull "$IMAGE"

      - name: Run single-GPU hardware tests
        uses: ./.github/actions/run-xdit-hw-tests
        with:
          image: ${{ env.IMAGE }}
          arch: ${{ matrix.arch }}
          suite: single
          artifact_name: ${{ github.run_number }}-xdit-hw-tests-${{ matrix.arch }}-single

      - name: Run multi-GPU hardware tests
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        uses: ./.github/actions/run-xdit-hw-tests
        with:
          image: ${{ env.IMAGE }}
          arch: ${{ matrix.arch }}
          suite: multi
          artifact_name: ${{ github.run_number }}-xdit-hw-tests-${{ matrix.arch }}-multi

      - name: Show GPU status
        if: always()
        run: amd-smi || rocm-smi || true

      - name: Cleanup
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/cleanup-workspace
        with:
          images: ${{ env.IMAGE }}
          containers: xdit-hw-tests
