# Runs the full build, MIOpen tuning, and filtered benchmark pipeline on behalf of xDiT.
name: xDiT Hardware Compat
run-name: "xDiT compat ${{ inputs.xdit_sha }} [xdit-run:${{ inputs.xdit_run_id }}]"

on:
  workflow_dispatch:
    inputs:
      xdit_sha:
        description: 'xDiT commit SHA under test'
        required: true
      xdit_run_id:
        description: 'Original xDiT run ID waiting on this workflow'
        required: true
      request_metadata:
        description: 'Request JSON: benchmarks, architectures (CSV), amd_ref, optional use_xdit_configs (boolean, default false)'
        required: true

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    name: Prepare xDiT image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      image: ${{ steps.tag.outputs.image }}
      benchmark_flags: ${{ steps.benchmarks.outputs.benchmark_flags }}
      architectures: ${{ steps.architectures.outputs.architectures }}
      amd_ref: ${{ steps.request.outputs.amd_ref }}
      use_xdit_configs: ${{ steps.request.outputs.use_xdit_configs }}
    steps:
      - name: Validate request metadata
        id: request
        env:
          REQUEST_METADATA: ${{ inputs.request_metadata }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUEST_METADATA" | jq -se '
            length == 1 and (.[0] | type == "object" and
              ([.benchmarks, .architectures, .amd_ref] | all(.[];
                type == "string" and length > 0 and
                (test("[\u0000-\u001f\u007f]") | not))) and
              (if has("use_xdit_configs") then .use_xdit_configs | type == "boolean" else true end))
          ' >/dev/null; then
            echo "::error::Request metadata must be one JSON object with non-empty, single-line string fields: benchmarks, architectures, amd_ref; optional use_xdit_configs must be a boolean."
            exit 1
          fi
          amd_ref=$(printf '%s' "$REQUEST_METADATA" | jq -r '.amd_ref')
          if [[ ! "$amd_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] ||
             ! git check-ref-format "refs/heads/${amd_ref}" >/dev/null 2>&1; then
            echo "::error::Invalid AMD ref: '${amd_ref}'"
            exit 1
          fi
          printf '%s' "$REQUEST_METADATA" | jq -r '
            "benchmarks=\(.benchmarks)",
            "architectures=\(.architectures)",
            "amd_ref=\(.amd_ref)",
            "use_xdit_configs=\(.use_xdit_configs // false)"
          ' >> "$GITHUB_OUTPUT"

      - name: Checkout AMD-AGI ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.amd_ref }}

      - name: Create image tag
        id: tag
        env:
          XDIT_SHA: ${{ inputs.xdit_sha }}
          XDIT_RUN_ID: ${{ inputs.xdit_run_id }}
        run: |
          if [[ ! "$XDIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid xDiT SHA: '${XDIT_SHA}'"
            exit 1
          fi
          if [[ ! "$XDIT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid xDiT run ID: '${XDIT_RUN_ID}'"
            exit 1
          fi
          MAIN_SHA=$(git rev-parse --short=7 HEAD)
          image_tag="${MAIN_SHA}-${XDIT_SHA:0:7}-${XDIT_RUN_ID}"
          {
            echo "image_tag=${image_tag}"
            echo "image=amdsiloai/pytorch-xdit-edge:${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate architectures
        id: architectures
        env:
          REQUESTED_ARCHITECTURES: ${{ steps.request.outputs.architectures }}
        run: |
          set -euo pipefail
          architectures=()
          IFS=',' read -r -a requested <<< "$REQUESTED_ARCHITECTURES"
          for architecture in "${requested[@]}"; do
            architecture=${architecture#"${architecture%%[![:space:]]*}"}
            architecture=${architecture%"${architecture##*[![:space:]]}"}
            if [[ ! "$architecture" =~ ^(gfx942|gfx950)$ ]]; then
              echo "::error::Invalid architecture: '${architecture}'"
              exit 1
            fi
            architectures+=("$architecture")
          done
          if [ "${#architectures[@]}" -eq 0 ]; then
            echo "::error::At least one architecture is required"
            exit 1
          fi
          sanitized_architectures=$(IFS=,; echo "${architectures[*]}")
          echo "architectures=${sanitized_architectures}" >> "$GITHUB_OUTPUT"

      - name: Validate benchmark selection
        id: benchmarks
        env:
          REQUESTED_BENCHMARKS: ${{ steps.request.outputs.benchmarks }}
          REQUESTED_ARCHITECTURES: ${{ steps.architectures.outputs.architectures }}
          USE_XDIT_CONFIGS: ${{ steps.request.outputs.use_xdit_configs }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/benchmark-selection.sh"
          # An empty result is valid: it selects every config for the
          # architecture under test, which the runner filters on by itself.
          benchmark_flags=$(normalize_benchmark_selection \
            "$REQUESTED_BENCHMARKS" "$REQUESTED_ARCHITECTURES" "$USE_XDIT_CONFIGS")
          echo "benchmark_flags=${benchmark_flags}" >> "$GITHUB_OUTPUT"

      - name: Summarize xDiT request
        env:
          XDIT_RUN_ID: ${{ inputs.xdit_run_id }}
          XDIT_SHA: ${{ inputs.xdit_sha }}
          BENCHMARK_FLAGS: ${{ steps.benchmarks.outputs.benchmark_flags }}
          IMAGE: ${{ steps.tag.outputs.image }}
          REQUEST_METADATA: ${{ inputs.request_metadata }}
          USE_XDIT_CONFIGS: ${{ steps.request.outputs.use_xdit_configs }}
        run: |
          metadata=$(printf '%s' "$REQUEST_METADATA" | jq .)
          {
            echo "## xDiT hardware request"
            echo
            echo "[Original xDiT run](${GITHUB_SERVER_URL}/xdit-project/xDiT/actions/runs/${XDIT_RUN_ID})"
            echo
            echo "### Received request metadata"
            echo
            echo "Original request.json:"
            echo '<pre>'
            printf '%s\n' "$metadata" | jq -Rr '@html'
            echo '</pre>'
            echo
            echo "### Execution"
            echo '<pre>'
            printf 'xDiT commit: %s\nImage: %s\nBenchmark flags: %s\nUse xDiT configs: %s\n' \
              "$XDIT_SHA" "$IMAGE" "${BENCHMARK_FLAGS:-(architecture filter only)}" "$USE_XDIT_CONFIGS" \
              | jq -Rr '@html'
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"

  build-image:
    name: Build xDiT image
    needs: [prepare]
    uses: ./.github/workflows/build-core-image-reusable.yml
    with:
      git_ref: ${{ needs.prepare.outputs.amd_ref }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      core_image_name: amdsiloai/pytorch-xdit-edge
      staging_image_name: amdsiloai/pytorch-xdit-edge
      cache_scope: 'xdit-external'
      docker_build_args: |
        XDIT_COMMIT=${{ inputs.xdit_sha }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}

  compat:
    needs: [prepare, build-image]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build-and-benchmark.yml
    with:
      git_branch: ${{ needs.prepare.outputs.amd_ref }}
      base_image: ${{ needs.build-image.outputs.staging_image_with_tag }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      rebuild: false
      run_miopen_tuning: true
      run_benchmarks: true
      build_final: true
      create_miopen_db_branch: false
      benchmark_flags: ${{ needs.prepare.outputs.benchmark_flags }}
      use_xdit_configs: ${{ fromJSON(needs.prepare.outputs.use_xdit_configs) }}
      cache_scope: 'xdit-external'
      docker_build_args: |
        XDIT_COMMIT=${{ inputs.xdit_sha }}
      gpu_runners: ${{ needs.prepare.outputs.architectures }}
    secrets:
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION }}
      DOCKERHUB_OAT: ${{ secrets.DOCKERHUB_OAT }}
      HF_TOKEN: ${{ secrets.XDIT_HF_TOKEN }}
