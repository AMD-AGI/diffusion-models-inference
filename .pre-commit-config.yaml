repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-s]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-shellcheck=']
        # gh-aw generated lock files use Actions syntax newer than actionlint; gh aw compile validates them.
        exclude: '\.lock\.yml$'

  - repo: local
    hooks:
      - id: check-spdx-headers
        name: Check SPDX headers
        entry: .ci/check_spdx_headers.sh
        language: script
        files: ^data/hipblaslt/.*\.yaml$|^data/miopen/resolve_prefix\.sh$
