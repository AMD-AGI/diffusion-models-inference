- name: flux.usp
  tags: [release, mad, lucid, instinct, gfx942, gfx950, sgld]
  model: black-forest-labs/FLUX.1-dev
  runner: xdit
  args:
    seed: 42
    prompt: A small cat
    height: 1024
    width: 1024
    num_inference_steps: 25
    max_sequence_length: 256
    warmup_calls: 5
    ulysses_degree: 8
    use_torch_compile: True
    guidance_scale: 0.0
    num_iterations: 50
    attention_backend: aiter

