- name: flux.default
  tags: [release, instinct]
  model: black-forest-labs/FLUX.1-dev
  revision: null
  num_gpus: 8
  runner: torchrun
  entrypoint: /app/Flux/run.py
  args:
    seed: 42
    prompt: A small cat
    height: 1024
    width: 1024
    num_inference_steps: 25
    max_sequence_length: 256
    warmup_steps: 5
    no_use_resolution_binning: True
    ulysses_degree: 8
    use_torch_compile: True
    guidance_scale: 0.0
    num_repetitions: 50
    attention_backend: aiter

