- name: flux2.default
  tags: [release, mad, lucid, instinct]
  model: black-forest-labs/FLUX.2-dev
  num_gpus: 8
  runner: torchrun
  entrypoint: /app/Flux/run_usp.py
  args:
    seed: 42
    prompt Add a cool hat to the: cat
    height: 1024
    width: 1024
    num_inference_steps: 50
    max_sequence_length: 512
    warmup_steps: 5
    no_use_resolution_binning: True
    ulysses_degree: 8
    use_torch_compile: True
    img_file_paths: /app/Flux/cat.png
    model_type: flux2
    guidance_scale: 4.0
    num_repetitions: 25
    attention_backend: aiter

