- name: hunyuanvideo.default
  tags: [release, mad, lucid, instinct]
  model: tencent/HunyuanVideo
  revision: refs/pr/18
  num_gpus: 8
  runner: torchrun
  entrypoint: /app/Hunyuanvideo/run.py
  args:
    prompt: In the large cage, two puppies were wagging their tails at each other.
    batch_size: 1
    height: 720
    width: 1280
    seed: 1168860793
    num_frames: 129
    num_inference_steps: 50
    warmup_steps: 1
    n_repeats: 1
    sleep_dur: 10
    ulysses_degree: 8
    enable_tiling: True
    enable_slicing: True
    guidance_scale: 6.0
    use_torch_compile: True
    attention_backend: aiter

