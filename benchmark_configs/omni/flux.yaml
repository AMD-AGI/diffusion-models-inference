- name: flux.usp
  tags: [release, instinct, gfx942, gfx950]
  model: black-forest-labs/FLUX.1-dev
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    seed: 42
    prompt: A small cat
    height: 1024
    width: 1024
    num_inference_steps: 25
    max_sequence_length: 256
    warmup_calls: 5
    ulysses_degree: 8
    use_torch_compile: True
    guidance_scale: 0.0
    num_iterations: 50

