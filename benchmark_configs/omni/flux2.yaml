- name: flux2.default
  tags: [release, lucid, instinct, gfx942, gfx950]
  model: black-forest-labs/FLUX.2-dev
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    seed: 42
    prompt: Add a cool hat to the cat
    height: 1024
    width: 1024
    num_inference_steps: 50
    warmup_calls: 5
    ulysses_degree: 8
    use_torch_compile: True
    input_images: https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/cat.png
    guidance_scale: 4.0
    num_iterations: 25

- name: flux2.quantgemm.gfx950
  tags: [gfx950]
  model: black-forest-labs/FLUX.2-dev
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    seed: 42
    prompt: Add a cool hat to the cat
    height: 1024
    width: 1024
    num_inference_steps: 50
    max_sequence_length: 512
    warmup_calls: 5
    ulysses_degree: 8
    use_torch_compile: True
    use_fp4_gemms: True
    input_images: /app/data/flux_cat.png
    guidance_scale: 4.0
    num_iterations: 25

