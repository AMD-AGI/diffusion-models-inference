# Blackwell quantgemm runs FP8, not FP4. xDiT's flux2.quantgemm.blackwell uses NVFP4
# (TorchAO), but vLLM-Omni has no online NVFP4 on CUDA (use_fp4_gemms maps to mxfp4,
# which is ROCm gfx950/NPU only; modelopt_fp4 only loads serialized checkpoints).
# SGLang makes the same trade-off (use_fp8_gemms). Treat this entry as an FP8 vs FP8
# comparison, not as a match for xDiT's FP4 recipe.
- name: flux2.quantgemm.blackwell
  tags: [lucid, blackwell, b200, b300]
  model: black-forest-labs/FLUX.2-dev
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    seed: 42
    prompt: Add a cool hat to the cat
    height: 1024
    width: 1024
    num_inference_steps: 50
    warmup_calls: 5
    ulysses_degree: 8
    use_torch_compile: true
    use_fp8_gemms: true
    input_images: /app/data/cat.png
    guidance_scale: 4.0
    num_iterations: 25
    attention_backend: CUDNN_ATTN
