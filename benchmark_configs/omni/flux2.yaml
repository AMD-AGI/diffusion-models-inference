- name: flux2.default
  tags: [release, mad, lucid, instinct, gfx942, gfx950]
  model: black-forest-labs/FLUX.2-dev
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    seed: 42
    prompt: Add a cool hat to the cat
    height: 1024
    width: 1024
    num_inference_steps: 50
    warmup_calls: 5
    ulysses_degree: 8
    use_torch_compile: true
    input_images: /app/data/cat.png
    guidance_scale: 4.0
    num_iterations: 25
    attention_backend: FLASH_ATTN

