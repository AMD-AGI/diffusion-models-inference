- name: minimax_h3.default
  tags: [lucid, instinct, gfx942, gfx950]
  model: MiniMaxAI/MiniMax-H3
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    seed: 42
    prompt: A cat flying through the universe on a broom, playing rap music from his boombox
    num_inference_steps: 50
    fps: 24
    height: 768
    width: 1344
    num_frames: 124
    aspect_ratio: "16:9"
    extra_params:
      task: t2va
    ulysses_degree: 8
    text_encoder_tp_size: 8
    use_parallel_vae: true
    use_torch_compile: true
    task_type: fl2va
    trust_remote_code: true
    warmup_calls: 1
    num_iterations: 5
    attention_backend: FLASH_ATTN

