- name: qwen_image.default
  tags: [release, lucid, mad, instinct, gfx942, gfx950]
  model: Qwen/Qwen-Image-2512
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    prompt: A cat holding a sign that says hello world
    height: 2048
    width: 2048
    seed: 42
    num_inference_steps: 50
    guidance_scale: 0.0
    warmup_calls: 2
    num_iterations: 25
    ulysses_degree: 8
    qwen_image_split_text_embed_in_sp: true
    use_torch_compile: true
    attention_backend: FLASH_ATTN

