- name: qwen_image_edit.default
  tags: [release, lucid, mad, instinct, gfx942, gfx950]
  model: Qwen/Qwen-Image-Edit
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    prompt: Add a cool hat to the cat.
    negative_prompt: " "
    height: 2048
    width: 2048
    input_images: /app/data/cat.png
    seed: 42
    num_inference_steps: 50
    true_cfg_scale: 4.0
    warmup_calls: 2
    num_iterations: 25
    ulysses_degree: 8
    qwen_image_split_text_embed_in_sp: true
    use_torch_compile: true
    attention_backend: FLASH_ATTN

