- name: qwen_image_edit.default
  tags: [release, lucid, instinct, gfx942, gfx950]
  model: Qwen/Qwen-Image-Edit
  runner: python
  entrypoint: /app/.ci/runner.py
  args:
    prompt: Add a cool hat to the cat.
    negative_prompt: ""
    height: 2048
    width: 2048
    input_images: /app/data/flux_cat.png
    seed: 42
    num_inference_steps: 50
    guidance_scale: 4.0
    num_iterations: 25
    ulysses_degree: 8
    use_torch_compile: True
    attention_backend: aiter
