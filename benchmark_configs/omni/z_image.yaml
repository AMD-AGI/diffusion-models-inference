- name: z_image.default
  tags: [instinct, gfx942, gfx950]
  model: Tongyi-MAI/Z-Image
  runner: python
  entrypoint: /app/.ci/online_runner.py
  args:
    seed: 42
    prompt: A crowded beach
    height: 1088
    width: 1920
    num_inference_steps: 50
    ulysses_degree: 8
    ulysses_mode: advanced_uaa
    use_torch_compile: True
    guidance_scale: 4.0
    num_iterations: 25

