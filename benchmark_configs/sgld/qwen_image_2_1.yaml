- name: qwen_image_2_1.default
  tags: [release, lucid, instinct, gfx942, gfx950]
  model: Qwen/Qwen-Image-2.1
  runner: python
  entrypoint: /app/.ci/runner.py
  args:
    prompt: A cat holding a sign that says hello world
    height: 2048
    width: 2048
    seed: 42
    num_inference_steps: 40
    guidance_scale: 1.0
    num_iterations: 10
    ulysses_degree: 8
    use_torch_compile: false
    attention_backend: aiter

