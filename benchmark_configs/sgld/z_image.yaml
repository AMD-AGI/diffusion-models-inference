- name: z_image.default
  tags: [release, lucid, instinct, gfx942, gfx950]
  model: Tongyi-MAI/Z-Image
  runner: python
  entrypoint: /app/.ci/runner.py
  args:
    prompt: A crowded beach
    height: 1088
    width: 1920
    seed: 42
    num_inference_steps: 50
    guidance_scale: 4.0
    num_iterations: 25
    ulysses_degree: 6
    use_torch_compile: false
    attention_backend: aiter

