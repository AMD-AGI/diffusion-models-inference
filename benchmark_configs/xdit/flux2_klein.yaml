- name: flux2_klein.default
  tags: [release, mad, lucid, instinct, gfx942, gfx950]
  model: black-forest-labs/FLUX.2-klein-9B
  runner: xdit
  args:
    seed: 42
    prompt: A spectacular sunset over the ocean
    height: 2048
    width: 2048
