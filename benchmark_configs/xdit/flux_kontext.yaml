- name: flux_kontext.1gpu.rdna4
  tags: [rdna4, gfx1201]
  model: black-forest-labs/FLUX.1-Kontext-dev
  runner: xdit
  args:
    seed: 42
    prompt: A small cat sitting in a garden
    height: 1024
    width: 1024
    num_inference_steps: 30
    max_sequence_length: 256
    warmup_calls: 2
    num_iterations: 5
    guidance_scale: 2.5
    input_images: /app/data/flux_cat.png
    resize_input_images: true
    attention_backend: aiter_flydsl_fp8
    use_torch_compile: true
    use_fp8_gemms: true
    cache_method: dbcache
