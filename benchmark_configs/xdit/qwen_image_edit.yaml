- name: qwen_image_edit.1gpu.rdna4
  tags: [rdna4, gfx1201]
  model: Qwen/Qwen-Image-Edit
  runner: xdit
  args:
    prompt: Add a cool hat to the cat.
    negative_prompt: " "
    height: 2048
    width: 2048
    input_images: /app/data/flux_cat.png
    seed: 42
    num_inference_steps: 4
    guidance_scale: 4.0
    num_iterations: 1
    attention_backend: aiter_flydsl
    ulysses_degree: 1
    ring_degree: 1
    enable_sequential_cpu_offload: true
    enable_tiling: true
    enable_slicing: true
    # re-evaluate use_fp8_gemms when benchmarking

- name: qwen_image_edit.2gpu.rdna4
  tags: [rdna4, gfx1201]
