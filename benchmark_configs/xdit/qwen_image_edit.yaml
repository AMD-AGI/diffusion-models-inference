    guidance_scale: 4.0
    num_iterations: 1
    attention_backend: aiter_flydsl
    ulysses_degree: 2
    ring_degree: 1
    fully_shard_degree: 2
    memory_efficient_sharding: true
    use_torch_compile: true
    enable_tiling: true
    enable_slicing: true
    use_fp8_gemms: true

