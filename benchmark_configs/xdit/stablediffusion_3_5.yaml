- name: stablediffusion_3_5.1gpu.rdna4
  tags: [rdna4, gfx1201]
  model: stabilityai/stable-diffusion-3.5-large
  runner: xdit
  args:
    seed: 42
    prompt: A capybara holding a sign that reads Hello World
    height: 1024
    width: 1024
    num_inference_steps: 28
    warmup_calls: 2
    num_iterations: 5
    guidance_scale: 3.5
    attention_backend: aiter_flydsl_fp8
    use_torch_compile: true
    enable_tiling: true
    enable_slicing: true
    vae_tile_latent_size: 64
    vae_tile_sample_size: 512
    cache_method: dbcache
