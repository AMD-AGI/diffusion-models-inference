- name: z_image_turbo.1gpu.rdna4
  tags: [rdna4, gfx1201]
  model: Tongyi-MAI/Z-Image-Turbo
  runner: xdit
  args:
    seed: 42
    prompt: A small cat
    height: 512
    width: 320
    num_inference_steps: 4
    warmup_calls: 3
    ulysses_degree: 1
    ring_degree: 1
    guidance_scale: 0.0
    num_iterations: 10
    attention_backend: aiter_flydsl
    use_torch_compile: true

