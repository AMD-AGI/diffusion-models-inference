- name: z_image_turbo.default
  tags: [release, mad, lucid, instinct]
  model: Tongyi-MAI/Z-Image-Turbo
  runner: xdit
  args:
    seed: 42
    prompt: A crowded beach
    height: 1088
    width: 1920
    num_inference_steps: 9
    ulysses_degree: 2
    use_torch_compile: True
    guidance_scale: 0.0
    num_iterations: 50
    attention_backend: aiter

